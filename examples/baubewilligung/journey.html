<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JourneyKit Viewer</title>
<meta name="description" content="Interaktive, evidenzbasierte User Journey: Journey-Layer, Prozess- und Fehlerpfade, Evidenz-Heatmap, Chancenmatrix und methodische Prüfung.">
<style>
:root {
  --bg: #f6f5f1; --surface: #ffffff; --surface-2: #efede7; --line: #d9d6cd; --line-strong: #b9b5a9;
  --ink: #1d1c1a; --ink-2: #5a5853; --ink-3: #8a877f;
  --accent: #2f4f7f; --accent-ink: #ffffff; --accent-soft: #e3eaf4;
  --observed: #1f7a8c; --observed-soft: #d9eef2; --reported: #6a4c93; --reported-soft: #e9e2f3; --assumed: #a07a2a; --assumed-soft: #f3ead6;
  --friction: #c47f17; --friction-soft: #fbead0; --breakdown: #b3261e; --breakdown-soft: #f8dcd9; --positive: #2e7d4f; --positive-soft: #d8eee0;
  --gap: #9c9a93; --shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.08);
  --radius: 10px; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --sans: "Inter", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15161a; --surface: #1e2026; --surface-2: #272a31; --line: #343842; --line-strong: #4a4f5b;
    --ink: #ebebe6; --ink-2: #b4b4ad; --ink-3: #85857f;
    --accent: #8fb0e0; --accent-ink: #0f1320; --accent-soft: #233044;
    --observed: #5fc3d6; --observed-soft: #173a42; --reported: #b79be0; --reported-soft: #33284a; --assumed: #e0b25a; --assumed-soft: #3f3418;
    --friction: #e5a24a; --friction-soft: #43301a; --breakdown: #ef7b73; --breakdown-soft: #4a1f1c; --positive: #6fcf93; --positive-soft: #1d3a29;
    --gap: #6e6e68; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"] {
  --bg: #15161a; --surface: #1e2026; --surface-2: #272a31; --line: #343842; --line-strong: #4a4f5b;
  --ink: #ebebe6; --ink-2: #b4b4ad; --ink-3: #85857f;
  --accent: #8fb0e0; --accent-ink: #0f1320; --accent-soft: #233044;
  --observed: #5fc3d6; --observed-soft: #173a42; --reported: #b79be0; --reported-soft: #33284a; --assumed: #e0b25a; --assumed-soft: #3f3418;
  --friction: #e5a24a; --friction-soft: #43301a; --breakdown: #ef7b73; --breakdown-soft: #4a1f1c; --positive: #6fcf93; --positive-soft: #1d3a29;
  --gap: #6e6e68; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.5);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0; font-weight: 600; letter-spacing: -0.01em; }
small, .muted { color: var(--ink-2); }
.mono { font-family: var(--mono); font-size: 12px; }

/* Kopf */
header.top { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-inner { padding: 12px 16px 0; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: flex-start; }
.title-block { flex: 1 1 320px; min-width: 0; }
.title-block h1 { font-size: 20px; line-height: 1.2; }
.title-block .sub { margin-top: 4px; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; color: var(--ink-2); }
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); font-size: 12px; white-space: nowrap; }
.badge.status-validated { border-color: var(--positive); color: var(--positive); background: var(--positive-soft); }
.badge.status-hypothesis, .badge.status-draft { border-color: var(--assumed); color: var(--assumed); background: var(--assumed-soft); }
.badge.synthetic { border-style: dashed; }
.badge.wrap { white-space: normal; max-width: 100%; border-radius: 10px; }
.badge.err { background: var(--breakdown-soft); color: var(--breakdown); border-color: var(--breakdown); }
.badge.warn { background: var(--friction-soft); color: var(--friction); border-color: var(--friction); }
.badge.ok { background: var(--positive-soft); color: var(--positive); border-color: var(--positive); }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.toggle { display: inline-flex; align-items: center; gap: 8px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer; user-select: none; }
.toggle input { accent-color: var(--accent); margin: 0; }
.toggle.active { border-color: var(--accent); background: var(--accent-soft); }
.btn { padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer; }
.btn:hover { border-color: var(--line-strong); }
select.persona { padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit; }
nav.tabs { display: flex; gap: 2px; padding: 8px 16px 0; overflow-x: auto; scrollbar-width: none; }
nav.tabs::-webkit-scrollbar { display: none; }
nav.tabs button { border: 0; background: transparent; padding: 8px 12px 10px; border-bottom: 2px solid transparent; color: var(--ink-2); white-space: nowrap; cursor: pointer; border-radius: 6px 6px 0 0; }
nav.tabs button:hover { color: var(--ink); background: var(--surface-2); }
nav.tabs button.active { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
nav.tabs button .n { margin-left: 6px; font-size: 11px; color: var(--ink-3); }
.evbar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; width: 160px; background: var(--surface-2); }
.evbar span { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--ink-2); align-items: center; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; border: 2px solid currentColor; vertical-align: -1px; }
.dot.fill { background: currentColor; }
.c-observed { color: var(--observed); } .c-reported { color: var(--reported); } .c-assumed { color: var(--assumed); } .c-gap { color: var(--gap); }

/* Layouts */
main { padding: 16px; max-width: 100%; }
section.layer { display: none; }
section.layer.active { display: block; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.panel + .panel { margin-top: 14px; }
.panel h2 { font-size: 15px; margin-bottom: 8px; }
.panel h3 { font-size: 13px; color: var(--ink-2); text-transform: uppercase; letter-spacing: .04em; margin: 14px 0 6px; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.tile { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; }
.tile .v { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
.tile .l { font-size: 12px; color: var(--ink-2); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--ink-2); font-weight: 600; font-size: 12px; }

/* Journey-Raster */
.map-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.map { display: grid; min-width: max-content; }
.map > div { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding: 10px 12px; min-width: 0; }
.map .rowlabel { position: sticky; left: 0; z-index: 3; background: var(--surface-2); font-size: 12px; font-weight: 600; color: var(--ink-2); text-transform: uppercase; letter-spacing: .04em; }
.map .rowlabel small { display: block; text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--ink-3); margin-top: 2px; }
.map .phase { background: var(--accent-soft); border-right: 2px solid var(--accent); }
.map .phase h3 { font-size: 14px; color: var(--ink); text-transform: none; letter-spacing: 0; margin: 0; }
.map .phase .intent { font-size: 12px; color: var(--ink-2); margin-top: 3px; }
.map .phase .dur { font-size: 11px; color: var(--ink-3); margin-top: 2px; }
.map .phase-end { border-right: 2px solid var(--accent); }
.dbar { position: relative; height: 14px; margin: 2px 0 6px; }
.dbar .typ { position: absolute; left: 0; top: 2px; height: 10px; border-radius: 2px; background: var(--accent); min-width: 2px; }
.dbar .rng { position: absolute; top: 6px; height: 2px; background: var(--ink-3); }
.dbar .rng::before, .dbar .rng::after { content: ""; position: absolute; top: -4px; width: 2px; height: 10px; background: var(--ink-3); }
.dbar .rng::before { left: 0; } .dbar .rng::after { right: 0; }
.dbasis { font-size: 11.5px; color: var(--ink-3); }
.step h4 { font-size: 13.5px; margin-bottom: 4px; }
.step .action { color: var(--ink-2); font-size: 13px; }
.step .meta { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px; border-radius: 6px; font-size: 11.5px; background: var(--surface-2); color: var(--ink-2); border: 1px solid transparent; }
.chip.transition { border-color: var(--friction); color: var(--friction); background: var(--friction-soft); }
.chip.actor { border-color: var(--line); border-style: dashed; }
.claim { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 8px 6px 10px; margin: 0 0 6px; cursor: pointer; position: relative; font-size: 13px; line-height: 1.35; }
.claim:hover { border-color: var(--accent); }
.claim::before { content: ""; position: absolute; left: 0; top: 6px; bottom: 6px; width: 3px; border-radius: 2px; background: var(--line-strong); }
.claim.ev-primary::before { background: linear-gradient(var(--observed), var(--reported)); }
.claim.ev-assumed { border-style: dashed; }
.claim.ev-assumed::before { background: var(--assumed); }
.claim.ev-none { border-style: dashed; color: var(--ink-2); }
.claim.ev-none::before { background: transparent; border-left: 3px dotted var(--gap); }
.claim .evc { display: inline-flex; gap: 3px; margin-left: 6px; vertical-align: middle; }
.claim .evc i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; }
.claim .evc i.o { background: var(--observed); } .claim .evc i.r { background: var(--reported); } .claim .evc i.a { background: var(--assumed); }
.claim.pp { padding-left: 12px; }
.claim.pp.friction::before { background: var(--friction); } .claim.pp.breakdown::before { background: var(--breakdown); }
.claim.pp .pp-head { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 3px; }
.tag { font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; font-weight: 700; padding: 1px 6px; border-radius: 4px; }
.tag.friction { background: var(--friction-soft); color: var(--friction); } .tag.breakdown { background: var(--breakdown-soft); color: var(--breakdown); }
.tag.status { background: var(--surface-2); color: var(--ink-2); font-weight: 600; text-transform: none; letter-spacing: 0; }
.sev { display: inline-flex; gap: 2px; }
.sev i { width: 6px; height: 6px; border-radius: 1px; background: var(--line-strong); display: inline-block; }
.sev i.on { background: var(--ink-2); }
.pp .wa { color: var(--ink-2); font-size: 12px; margin-top: 3px; }
.hidden-note { font-size: 11.5px; color: var(--ink-3); font-style: italic; padding: 4px 0; }
.empty { color: var(--ink-3); font-size: 12px; }
.kpi { font-size: 12.5px; padding: 4px 0; border-bottom: 1px dashed var(--line); }
.kpi:last-child { border-bottom: 0; }
.kpi b { font-weight: 600; }
.kpi .k { color: var(--ink-3); font-size: 11px; }

/* Gefühlskurve */
.curve { position: relative; height: 150px; padding: 0 !important; }
.curve svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.curve .zero { position: absolute; left: 0; right: 0; top: 50%; border-top: 1px dashed var(--line-strong); }
.curve .nodata { position: absolute; bottom: 3px; padding: 0 8px; font-size: 10.5px; line-height: 1.3; color: var(--ink-3); font-style: italic; text-align: center; pointer-events: none; }
.curve .dropped { position: absolute; top: 3px; right: 8px; max-width: 60%; font-size: 10.5px; color: var(--ink-3); font-style: italic; text-align: right; }
.curve .pt { position: absolute; width: 14px; height: 14px; border-radius: 50%; transform: translate(-50%, -50%); border: 2.5px solid var(--ink); background: var(--ink); cursor: pointer; z-index: 2; }
.curve .pt.hollow { background: var(--surface); border-style: solid; }
.curve .pt.assumed { border-color: var(--assumed); background: var(--surface); border-style: dashed; }
.curve .pt.gap { width: 18px; height: 18px; border: 2px dotted var(--gap); background: transparent; color: var(--gap); font-size: 11px; display: flex; align-items: center; justify-content: center; }
.curve .pt.other { width: 9px; height: 9px; border-width: 2px; opacity: .85; z-index: 1; }
.curve .lbl { position: absolute; transform: translateX(-50%); font-size: 11px; color: var(--ink-2); max-width: 180px; text-align: center; line-height: 1.25; pointer-events: none; background: color-mix(in srgb, var(--surface) 85%, transparent); padding: 1px 4px; border-radius: 4px; }
.curve .scale { position: absolute; left: 4px; font-size: 10px; color: var(--ink-3); }

/* Prozess-Layer */
.flow { display: flex; flex-direction: column; gap: 0; }
.flow .phase-h { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-2); margin: 18px 0 8px; display: flex; align-items: center; gap: 10px; }
.flow .phase-h::after { content: ""; flex: 1; border-top: 1px solid var(--line); }
.node-row { display: grid; grid-template-columns: minmax(240px, 1.1fr) minmax(0, 2fr); gap: 14px; align-items: start; position: relative; padding-left: 22px; }
.node-row::before { content: ""; position: absolute; left: 7px; top: 0; bottom: 0; border-left: 2px solid var(--line-strong); }
.node-row:last-child::before { bottom: 50%; }
.node { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; position: relative; }
.node::before { content: ""; position: absolute; left: -19px; top: 16px; width: 10px; height: 10px; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent); }
.node.has-breakdown { border-color: var(--breakdown); }
.node.has-breakdown::before { border-color: var(--breakdown); background: var(--breakdown); }
.node h4 { font-size: 13.5px; }
.node .act { color: var(--ink-2); font-size: 12.5px; margin-top: 2px; }
.branches { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
.branch { border-radius: 10px; padding: 8px 10px 8px 12px; border: 1px solid var(--line); position: relative; font-size: 12.5px; background: var(--surface); }
.branch.bd { border-color: var(--breakdown); background: var(--breakdown-soft); }
.branch.fr { border-color: var(--friction); background: var(--friction-soft); }
.branch.ec { border-left: 3px solid var(--assumed); }
.branch .arrow { display: flex; gap: 8px; align-items: flex-start; margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--line-strong); }
.branch .arrow .lab { font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; font-weight: 700; white-space: nowrap; padding-top: 1px; }
.branch .arrow.rec .lab { color: var(--positive); }
.branch .arrow.rec.soll { opacity: .85; } .branch .arrow.rec.soll .lab { color: var(--assumed); }
.branch .arrow.wa .lab { color: var(--breakdown); }

/* Evidenz-Layer */
.heat { overflow-x: auto; }
.heat table { min-width: max-content; }
.heat td.cell { text-align: center; padding: 0; }
.heat .hc { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 64px; height: 44px; margin: 2px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; border: 1px solid transparent; }
.heat .hc small { font-weight: 400; font-size: 10px; opacity: .8; }
.heat .hc.gap { border: 1px dashed var(--gap); color: var(--gap); font-weight: 400; }
.heat .hc.na { background: transparent; color: var(--ink-3); cursor: default; }
.heat th.step { font-weight: 500; color: var(--ink); max-width: 120px; white-space: normal; font-size: 11.5px; }
.heat th.phase { background: var(--accent-soft); font-size: 11px; text-align: center; }
.src-pii { font-size: 11px; }
.atom { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; background: var(--surface); }
.atom .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 4px; font-size: 11.5px; color: var(--ink-2); }
.atom .cls { font-weight: 700; text-transform: uppercase; letter-spacing: .05em; font-size: 10.5px; padding: 1px 6px; border-radius: 4px; }
.atom .cls.observed { background: var(--observed-soft); color: var(--observed); } .atom .cls.reported { background: var(--reported-soft); color: var(--reported); } .atom .cls.assumed { background: var(--assumed-soft); color: var(--assumed); }
.atom q { quotes: "«" "»"; font-style: italic; }
.atom .txt { font-size: 13px; }
.atom .loc { font-family: var(--mono); font-size: 11px; color: var(--ink-3); }
.atom .contra { margin-top: 4px; font-size: 12px; color: var(--breakdown); }

/* Chancen-Layer */
.matrix { position: relative; width: 100%; aspect-ratio: 1.3; max-height: 460px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); overflow: hidden; }
.matrix .q { position: absolute; width: 50%; height: 50%; padding: 8px 10px; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); }
.matrix .q.tl { left: 0; top: 0; width: 39.5%; border-right: 1px dashed var(--line-strong); border-bottom: 1px dashed var(--line-strong); }
.matrix .q.tr { right: 0; top: 0; width: 60.5%; border-bottom: 1px dashed var(--line-strong); text-align: right; }
.matrix .q.bl { left: 0; bottom: 0; width: 39.5%; border-right: 1px dashed var(--line-strong); display: flex; align-items: flex-end; }
.matrix .q.br { right: 0; bottom: 0; width: 60.5%; display: flex; align-items: flex-end; justify-content: flex-end; }
.matrix .ax { position: absolute; font-size: 11px; color: var(--ink-2); }
.matrix .ax.x { bottom: 4px; left: 50%; transform: translateX(-50%); } .matrix .ax.y { top: 50%; left: 50%; transform: translate(-50%, -50%); color: var(--ink-3); font-size: 10px; }
.matrix .opp { position: absolute; transform: translate(-50%, -50%); width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 2px solid var(--surface); box-shadow: var(--shadow); }
.matrix .opp:hover { transform: translate(-50%, -50%) scale(1.15); }
.opp-card { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; background: var(--surface); }
.opp-card .h { display: flex; gap: 8px; align-items: flex-start; }
.opp-card .num { flex: 0 0 auto; width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.opp-card .scores { display: flex; gap: 10px; font-size: 11.5px; color: var(--ink-2); margin: 6px 0; flex-wrap: wrap; }
.opp-card ul { margin: 6px 0 0; padding-left: 18px; font-size: 12.5px; }
.opp-card li.mvp::marker { content: "✓ "; color: var(--positive); }

/* Prüfung */
.finding { display: grid; grid-template-columns: 64px 1fr; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.finding:last-child { border-bottom: 0; }
.finding .lvl { font-size: 10.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 2px 6px; border-radius: 4px; text-align: center; align-self: start; }
.finding .lvl.ERROR { background: var(--breakdown-soft); color: var(--breakdown); } .finding .lvl.WARN { background: var(--friction-soft); color: var(--friction); } .finding .lvl.INFO { background: var(--surface-2); color: var(--ink-2); }
.finding .hint { color: var(--ink-2); font-size: 12.5px; margin-top: 2px; }
.finding .path { font-family: var(--mono); font-size: 11px; color: var(--ink-3); }

/* Drawer */
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(480px, 100%); background: var(--surface); border-left: 1px solid var(--line); box-shadow: var(--shadow); transform: translateX(105%); transition: transform .22s ease; z-index: 40; display: flex; flex-direction: column; }
.drawer.open { transform: none; }
.drawer .dh { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: flex-start; }
.drawer .dh h2 { font-size: 14px; flex: 1; }
.drawer .db { padding: 14px 16px; overflow: auto; }
.drawer .close { border: 0; background: var(--surface-2); border-radius: 6px; width: 30px; height: 30px; cursor: pointer; }
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.25); z-index: 30; display: none; }
.scrim.open { display: block; }
.claim-txt { font-size: 14px; margin-bottom: 10px; }
.verdict { font-size: 12.5px; padding: 8px 10px; border-radius: 8px; margin-bottom: 12px; }
.verdict.p { background: var(--positive-soft); } .verdict.a { background: var(--assumed-soft); } .verdict.n { background: var(--surface-2); color: var(--ink-2); }

s Eigentümerin möchte ich nach wenigen Fragen wissen, ob ich ein Gesuch brauche, damit ich nicht auf einen Rückruf warten muss.", "mvp": true}, {"text": "Als Eigentümer möchte ich am Ende sehen, welche Unterlagen ich brauche und wer sie erstellt.", "mvp": false}], "evidence_refs": ["b1-27", "web-01", "anf-01"]}, {"id": "opp-vollstaendigkeit-beim-upload", "hmw": "Wie könnten wir Unvollständigkeit beim Hochladen erkennen statt nach drei Wochen?", "description": "Pflichtfelder und Formularprüfung im Portal; Hinweis auf das gültige Lärmschutzformular direkt beim Upload.", "linked_pain_points": ["pp-rueckweisung-nach-wochen", "pp-laermnachweis-unklar"], "phase_ref": "gesuch", "user_impact": 5, "public_value": 4, "effort": 3, "owner": "Bauberatung", "status": "open", "stories": [{"text": "Als Gesuchstellende möchte ich beim Hochladen erfahren, ob ein Dokument fehlt, damit mein Gesuch nicht wochenlang ruht.", "mvp": true}, {"text": "Als Installationsfirma möchte ich den Lärmschutznachweis vorprüfen lassen, bevor das Gesuch eingereicht wird.", "mvp": false}], "evidence_refs": ["b1-12", "stat-04", "stat-05", "anf-06"]}, {"id": "opp-installationsfirmen-befaehigen", "hmw": "Wie könnten wir Installationsfirmen befähigen, den Lärmschutznachweis beim ersten Mal richtig zu liefern?", "description": "Vorlage mit ausgefülltem Beispiel und Merkblatt für Firmen; die Firmen sind die eigentlichen Nutzenden des Formulars.", "linked_pain_points": ["pp-laermnachweis-unklar", "pp-postbotin"], "phase_ref": "gesuch", "user_impact": 4, "public_value": 4, "effort": 2, "owner": "Fachstelle Lärmschutz", "status": "open", "stories": [{"text": "Als Installationsfirma möchte ich ein ausgefülltes Beispiel des Lärmschutznachweises, damit das Gesuch nicht zurückkommt.", "mvp": true}], "evidence_refs": ["anf-05", "b1-09"]}, {"id": "opp-status-mit-naechstem-schritt", "hmw": "Wie könnten wir die Wartezeit sichtbar machen – wer prüft, was als Nächstes kommt, wie lange es üblicherweise dauert?", "description": "Statusseite mit Meilensteinen (vollständig, publiziert, Auflage endet am …, Fachprüfung, Entscheid) und typischer Restdauer; Mitteilung bei der Publikation.", "linked_pain_points": ["pp-status-ohne-aussage", "pp-publikation-ohne-mitteilung"], "phase_ref": "warten", "user_impact": 4, "public_value": 3, "effort": 3, "owner": "Bausekretariat", "status": "open", "stories": [{"text": "Als Gesuchstellender möchte ich sehen, in welchem Schritt mein Gesuch ist und wie lange dieser üblicherweise dauert, damit ich den Einbau planen kann.", "mvp": true}, {"text": "Als Gesuchstellende möchte ich benachrichtigt werden, wenn mein Gesuch publiziert wird.", "mvp": true}], "evidence_refs": ["b1-16", "b1-25", "web-04"]}, {"id": "opp-eigentuemerschaft-informiert", "hmw": "Wie könnten wir die Eigentümerschaft informiert halten, auch wenn eine Firma das Gesuch vertritt?", "description": "Kopie aller Schreiben und Statuszugang für die Eigentümerschaft, unabhängig von der Vertretung.", "linked_pain_points": ["pp-vertretung-keine-auskunft"], "phase_ref": "warten", "user_impact": 3, "public_value": 3, "effort": 1, "owner": "Bausekretariat", "status": "open", "stories": [{"text": "Als Eigentümer möchte ich eine Kopie jedes Schreibens erhalten, das an meine Vertretung geht, damit ich über mein Haus Bescheid weiss.", "mvp": true}], "evidence_refs": ["b2-16", "anf-11"]}, {"id": "opp-nachbarschaft-frueh", "hmw": "Wie könnten wir Gesuchstellende ermutigen, den Standort vor dem Einreichen mit der Nachbarschaft zu besprechen?", "description": "Hinweis im Bewilligungs-Check und in der Unterlagenliste; Vorlage für ein kurzes Informationsschreiben an die Nachbarn.", "linked_pain_points": ["pp-einsprache-unvorbereitet", "pp-standort-nachtraeglich"], "phase_ref": "warten", "user_impact": 4, "public_value": 5, "effort": 2, "owner": "Bauberatung", "status": "open", "stories": [{"text": "Als Gesuchstellende möchte ich vor dem Einreichen einen Hinweis und eine Vorlage, um die Nachbarn zu informieren, damit wir uns nicht über die Gemeinde begegnen.", "mvp": true}], "evidence_refs": ["b2-17", "b1-19", "stat-09"]}, {"id": "opp-gebuehr-vorab", "hmw": "Wie könnten wir die Gebühr vor dem Einreichen abschätzbar machen?", "description": "Richtwert der Gebühr im Bewilligungs-Check und in der Eingangsbestätigung.", "linked_pain_points": ["pp-gebuehr-unbekannt"], "phase_ref": "entscheid", "user_impact": 2, "public_value": 2, "effort": 1, "owner": "Bausekretariat", "status": "open", "stories": [{"text": "Als Eigentümerin möchte ich die ungefähre Gebühr kennen, bevor ich einreiche, damit ich sie in die Finanzierung einrechnen kann.", "mvp": false}], "evidence_refs": ["b1-22", "anf-12"]}], "sources": [{"id": "int-b1", "title": "Interview B1 – Eigentümerin, erstes Baugesuch ohne Planungsbüro", "kind": "interview", "default_class": "reported", "date": "2026-02", "n": 1, "participants": "Eigentümerin Einfamilienhaus, Heizungsersatz nach Ausfall", "pii_status": "anonymised", "location": "input/interview-b1.md", "notes": "Synthetisches Transkript, gekürzt."}, {"id": "int-b2", "title": "Interview B2 – Eigentümer, Gesuch durch die Installationsfirma", "kind": "interview", "default_class": "reported", "date": "2026-02", "n": 1, "participants": "Eigentümer Reiheneckhaus, Gesuch vertreten durch Installationsfirma", "pii_status": "anonymised", "location": "input/interview-b2.md", "notes": "Synthetisches Transkript, gekürzt."}, {"id": "anfragen", "title": "Anfragen an die Bauberatung (anonymisierter Export)", "kind": "inquiry_log", "default_class": "observed", "date": "2025-01 bis 2025-12", "n": 30, "participants": "Eigentümerschaften, Installationsfirmen, Nachbarschaft", "pii_status": "anonymised", "location": "input/anfragen-export.csv", "notes": "Synthetische Stichprobe von 30 Anfragen zu Wärmepumpen; Kurztexte ohne Namen und Adressen."}, {"id": "statistik", "title": "Gesuchsstatistik Wärmepumpen 2025 (Geschäftskontrolle)", "kind": "case_records", "default_class": "observed", "date": "2025", "n": 84, "participants": "alle ordentlichen Verfahren für Wärmepumpen an Ein- und Zweifamilienhäusern", "pii_status": "none", "location": "input/gesuchsstatistik.csv", "notes": "Aggregierte Auswertung aus der Geschäftskontrolle."}, {"id": "analytics", "title": "Webanalytics Bauen und Gesuchsportal", "kind": "analytics", "default_class": "observed", "date": "2025", "pii_status": "none", "location": "input/webanalytics.csv"}, {"id": "prozessdok", "title": "Prozessbeschrieb Baubewilligung, ordentliches Verfahren (Soll, intern)", "kind": "internal_document", "default_class": "assumed", "date": "2025", "pii_status": "none", "location": "input/prozess-baubewilligung-intern.md"}, {"id": "workshop", "title": "Hypothesen-Workshop ohne Gesuchstellende und Nachbarn", "kind": "workshop", "default_class": "assumed", "date": "2026-03-12", "n": 5, "participants": "Bauberatung, Bausekretariat, Fachstelle Lärmschutz (Rollen)", "pii_status": "none", "location": "input/workshop-notizen.md"}], "evidence": [{"id": "b1-01", "source_ref": "int-b1", "class": "reported", "kind": "quote", "text": "Die Ölheizung ist im Oktober ausgestiegen.", "locator": "Zeile 7", "signal": "breakdown", "phase_hint": "orientierung", "persona_hint": "erstbauherrschaft", "tags": ["ersatz-nach-ausfall"]}, {"id": "b1-02", "source_ref": "int-b1", "class": "reported", "kind": "quote", "text": "Ich dachte, eine Heizung ist eine Heizung, die tauscht man einfach aus.", "locator": "Zeile 10", "signal": "need", "phase_hint": "orientierung", "persona_hint": "erstbauherrschaft"}, {"id": "b1-03", "source_ref": "int-b1", "class": "reported", "kind": "quote", "text": "Dass das Aussengerät ein Bauvorhaben ist, hat mir erst der Installateur gesagt.", "locator": "Zeile 10", "signal": "need", "phase_hint": "orientierung", "persona_hint": "erstbauherrschaft", "tags": ["vermittlung"]}, {"id": "b1-04", "source_ref": "int-b1", "class": "reported", "kind": "quote", "text": "Es gibt eine Seite «Braucht es eine Bewilligung?», aber die Antwort war: Es kommt darauf an.", "locator": "Zeile 12", "signal": "friction", "phase_hint": "orientierung", "channel_hint": "web", "persona_hint": "erstbauherrschaft"}, {"id": "b1-05", "source_ref": "int-b1", "class": "reported", "kind": "quote", "text": "Ich wusste danach weniger als vorher und war ziemlich verunsichert.", "locator": "Zeile 13", "signal": "friction", "phase_hint": "orientierung", "channel_hint": "web", "persona_hint": "erstbauherrschaft", "emotion_hint": {"valence": -1, "label": "verunsichert", "explicit": true}}, {"id": "b1-06", "source_ref": "int-b1", "class": "reported", "kind": "quote", "text": "Ich habe die Bauberatung angerufen.", "locator": "Zeile 15", "signal": "workaround", "phase_hint": "orientierung", "channel_hint": "phone", "persona_hint": "erstbauherrschaft"}, {"id": "b1-07", "source_ref": "int-b1", "class": "reported", "kind": "quote", "text": "Das Telefonat hat mehr gebracht als eine Stunde auf der Website.", "locator": "Zeile 16", "signal": "positive", "phase_hint": "orientierung", "channel_hint": "phone", "persona_hint": "erstbauherrschaft"}, {"id": "b1-08", "source_ref": "int-b1", "class": "reported", "kind": "quote", "text": "Beim Lärmschutznachweis wusste ich nicht einmal, wer so etwas macht.", "locator": "Zeile 18", "signal": "friction", "phase_hint": "gesuch", "persona_hint": "erstbauherrschaft"}, {"id": "b1-09", "source_ref": "int-b1", "class": "reported", "kind": "quote", "text": "Der Installateur hat dann ein Formular ausgefüllt, das er schon von anderen Gemeinden kannte. Ich habe einfach hochgeladen, was er mir geschickt hat.", "locator": "Zeile 19", "signal": "workaround", "phase_hint": "gesuch", "persona_hint": "erstbauherrschaft", "tags": ["vermittlung"]}, {"id": "b1-10", "source_ref": "int-b1", "class": "reported", "kind": "quote", "text": "Nach drei Wochen kam ein Brief: Das Gesuch sei unvollständig, der Lärmschutznachweis müsse mit dem kantonalen Formular und mit dem genauen Standort gemacht werden.", "locator": "Zeile 21", "signal": "breakdown", "phase_hint": "gesuch", "channel_hint": "letter", "persona_hint": "erstbauherrschaft"}, {"id": "b1-11", "source_ref": "int-b1", "class": "reported", "kind": "quote", "text": "Drei Wochen, in denen ich dachte, es läuft. Und es lief gar nichts.", "locator": "Zeile 22", "signal": "breakdown", "phase_hint": "gesuch", "persona_hint": "erstbauherrschaft", "contradicts": ["doc-01"]}, {"id": "b1-12", "source_ref": "int-b1", "class": "reported", "kind": "quote", "text": "Ich war wütend, ehrlich gesagt. Nicht auf die Person, sondern weil man das doch beim Hochladen hätte merken können.", "locator": "Zeile 23", "signal": "breakdown", "phase_hint": "gesuch", "persona_hint": "erstbauherrschaft", "emotion_hint": {"valence": -2, "label": "wütend", "explicit": true}}, {"id": "b1-13", "source_ref": "int-b1", "class": "reported", "kind": "quote", "text": "Mit zwei Elektroöfen, die uns der Installateur geliehen hat. Und der Holzofen im Wohnzimmer. Das Badezimmer war im Dezember zwölf Grad.", "locator": "Zeile 25", "signal": "workaround", "phase_hint": "gesuch", "persona_hint": "erstbauherrschaft", "tags": ["ersatz-nach-ausfall"]}, {"id": "b1-14", "source_ref": "int-b1", "class": "reported", "kind": "quote", "text": "Ich habe es im Amtsblatt gesehen, weil der Nachbar mich darauf angesprochen hat, nicht weil mir jemand Bescheid gegeben hat.", "locator": "Zeile 27", "signal": "friction", "phase_hint": "warten", "persona_hint": "erstbauherrschaft", "contradicts": ["doc-03"]}, {"id": "b1-15", "source_ref": "int-b1", "class": "reported", "kind": "quote", "text": "Danach habe ich im Portal fast jeden Tag auf den Status geschaut. Da stand wochenlang «in Prüfung».", "locator": "Zeile 28", "signal": "friction", "phase_hint": "warten", "channel_hint": "web", "persona_hint": "erstbauherrschaft", "contradicts": ["ws-05"]}, {"id": "b1-16", "source_ref": "int-b1", "class": "reported", "kind": "quote", "text": "Was heisst in Prüfung? Wer prüft? Wie lange noch?", "locator": "Zeile 28", "signal": "need", "phase_hint": "warten", "channel_hint": "web", "persona_hint": "erstbauherrschaft"}, {"id": "b1-17", "source_ref": "int-b1", "class": "reported", "kind": "quote", "text": "Dieses Warten ohne Information hat mich mehr zermürbt als das kalte Badezimmer.", "locator": "Zeile 29", "signal": "friction", "phase_hint": "warten", "persona_hint": "erstbauherrschaft", "emotion_hint": {"valence": -2, "label": "zermürbt", "explicit": true}, "contradicts": ["ws-02"]}, {"id": "b1-18", "source_ref": "int-b1", "class": "reported", "kind": "quote", "text": "Zweimal angerufen. Beide Male hiess es, das sei normal, man könne noch nichts sagen.", "locator": "Zeile 31", "signal": "workaround", "phase_hint": "warten", "channel_hint": "phone", "persona_hint": "erstbauherrschaft"}, {"id": "b1-19", "source_ref": "int-b1", "class": "reported", "kind": "quote", "text": "Der Nachbar hatte vorher gefragt, wo das Gerät hinkommt, und ich habe es ihm gezeigt.", "locator": "Zeile 33", "signal": "positive", "phase_hint": "warten", "persona_hint": "erstbauherrschaft"}, {"id": "b1-20", "source_ref": "int-b1", "class": "reported", "kind": "quote", "text": "Vier Seiten, die Hälfte davon Rechtsmittelbelehrung und Gebühren.", "locator": "Zeile 35", "signal": "friction", "phase_hint": "entscheid", "channel_hint": "letter", "persona_hint": "erstbauherrschaft"}, {"id": "b1-21", "source_ref": "int-b1", "class": "reported", "kind": "quote", "text": "Die Gebühr war 740 Franken. Das stand nirgends vorher.", "locator": "Zeile 36", "signal": "friction", "phase_hint": "entscheid", "persona_hint": "erstbauherrschaft", "contradicts": ["ws-04"]}, {"id": "b1-22", "source_ref": "int-b1", "class": "reported", "kind": "quote", "text": "Ich hätte es nicht anders gemacht, aber ich hätte es gern gewusst.", "locator": "Zeile 36", "signal": "need", "phase_hint": "entscheid", "persona_hint": "erstbauherrschaft"}, {"id": "b1-23", "source_ref": "int-b1", "class": "reported", "kind": "quote", "text": "Ich habe das an den Installateur weitergeleitet, und er hat gesagt, das mache er sowieso.", "locator": "Zeile 37", "signal": "neutral", "phase_hint": "umsetzung", "persona_hint": "erstbauherrschaft", "tags": ["vermittlung"]}, {"id": "b1-24", "source_ref": "int-b1", "class": "reported", "kind": "quote", "text": "Seither ist es warm. Ich bin froh, dass es vorbei ist.", "locator": "Zeile 39", "signal": "positive", "phase_hint": "umsetzung", "persona_hint": "erstbauherrschaft", "emotion_hint": {"valence": 1, "label": "froh, dass es vorbei ist", "explicit": true}}, {"id": "b1-25", "source_ref": "int-b1", "class": "reported", "kind": "quote", "text": "Und während des Wartens irgendein Zeichen, dass jemand an meinem Gesuch arbeitet.", "locator": "Zeile 41", "signal": "need", "phase_hint": "warten", "persona_hint": "erstbauherrschaft"}, {"id": "b1-26", "source_ref": "int-b1", "class": "reported", "kind": "quote", "text": "Ich war ja nur die Postbotin zwischen ihm und der Gemeinde.", "locator": "Zeile 42", "signal": "friction", "phase_hint": "gesuch", "persona_hint": "erstbauherrschaft", "tags": ["vermittlung"]}, {"id": "b1-27", "source_ref": "int-b1", "class": "reported", "kind": "quote", "text": "Am Anfang eine klare Antwort, ob ich eine Bewilligung brauche.", "locator": "Zeile 41", "signal": "need", "phase_hint": "orientierung", "persona_hint": "erstbauherrschaft"}, {"id": "b1-28", "source_ref": "int-b1", "class": "reported", "kind": "quote", "text": "Mitte Februar, zwei Tage.", "locator": "Zeile 39", "signal": "neutral", "phase_hint": "umsetzung", "persona_hint": "erstbauherrschaft"}, {"id": "b2-01", "source_ref": "int-b2", "class": "reported", "kind": "quote", "text": "Ich habe keine Zeit, mich in Baurecht einzulesen.", "locator": "Zeile 7", "signal": "need", "phase_hint": "orientierung", "persona_hint": "erstbauherrschaft"}, {"id": "b2-02", "source_ref": "int-b2", "class": "reported", "kind": "quote", "text": "Ich habe eine Vollmacht unterschrieben, und dann habe ich ehrlich gesagt nicht mehr daran gedacht.", "locator": "Zeile 8", "signal": "neutral", "phase_hint": "gesuch", "persona_hint": "erstbauherrschaft", "tags": ["vermittlung"]}, {"id": "b2-03", "source_ref": "int-b2", "class": "reported", "kind": "quote", "text": "Die Briefe der Gemeinde gingen an die Firma, weil sie als Vertreterin eingetragen war. Ich habe nichts bekommen, bis die Einsprache kam.", "locator": "Zeile 10", "signal": "breakdown", "phase_hint": "warten", "persona_hint": "erstbauherrschaft", "contradicts": ["ws-01"], "tags": ["vermittlung"]}, {"id": "b2-04", "source_ref": "int-b2", "class": "reported", "kind": "quote", "text": "Davon habe ich durch einen eingeschriebenen Brief erfahren, der direkt an mich ging. Ich dachte zuerst, ich hätte etwas falsch gemacht.", "locator": "Zeile 12", "signal": "friction", "phase_hint": "warten", "channel_hint": "letter", "persona_hint": "erstbauherrschaft"}, {"id": "b2-05", "source_ref": "int-b2", "class": "reported", "kind": "quote", "text": "Bei einer Wärmepumpe hätte ich das nie erwartet.", "locator": "Zeile 13", "signal": "friction", "phase_hint": "warten", "persona_hint": "erstbauherrschaft"}, {"id": "b2-06", "source_ref": "int-b2", "class": "reported", "kind": "quote", "text": "Es war unangenehm. Wir wohnen seit acht Jahren nebeneinander, und plötzlich kommunizieren wir über die Gemeinde.", "locator": "Zeile 15", "signal": "friction", "phase_hint": "warten", "persona_hint": "erstbauherrschaft", "emotion_hint": {"valence": -1, "label": "unangenehm", "explicit": true}}, {"id": "b2-07", "source_ref": "int-b2", "class": "reported", "kind": "quote", "text": "Er hat gesagt, er habe nichts gegen die Wärmepumpe, nur gegen den Standort direkt unter seinem Schlafzimmerfenster. Das hatte niemand mit ihm besprochen.", "locator": "Zeile 16", "signal": "need", "phase_hint": "warten", "persona_hint": "erstbauherrschaft"}, {"id": "b2-08", "source_ref": "int-b2", "class": "reported", "kind": "quote", "text": "Die Gemeinde hat eine Einigungsverhandlung angeboten. Das war gut gemacht, sachlich, mit einem Lärmfachmann.", "locator": "Zeile 18", "signal": "positive", "phase_hint": "entscheid", "channel_hint": "in_person", "persona_hint": "erstbauherrschaft", "emotion_hint": {"valence": 1, "label": "gut gemacht, sachlich", "explicit": false}}, {"id": "b2-09", "source_ref": "int-b2", "class": "reported", "kind": "quote", "text": "Wir haben den Standort um drei Meter verschoben, auf die Gartenseite.", "locator": "Zeile 18", "signal": "neutral", "phase_hint": "entscheid", "persona_hint": "erstbauherrschaft"}, {"id": "b2-10", "source_ref": "int-b2", "class": "reported", "kind": "quote", "text": "Neue Pläne, neuer Lärmnachweis, das hat die Firma gemacht und mir verrechnet.", "locator": "Zeile 21", "signal": "friction", "phase_hint": "entscheid", "persona_hint": "erstbauherrschaft", "tags": ["vermittlung"]}, {"id": "b2-11", "source_ref": "int-b2", "class": "reported", "kind": "quote", "text": "Insgesamt hat es von der Offerte bis zum Einbau fast sieben Monate gedauert. Die Firma hatte drei Monate gesagt.", "locator": "Zeile 21", "signal": "friction", "phase_hint": "entscheid", "persona_hint": "erstbauherrschaft"}, {"id": "b2-12", "source_ref": "int-b2", "class": "reported", "kind": "quote", "text": "Die Firma wusste, dass der Standort heikel ist. Sie hat das nie erwähnt, weil es der günstigste Standort war.", "locator": "Zeile 22", "signal": "friction", "phase_hint": "warten", "persona_hint": "erstbauherrschaft", "tags": ["vermittlung"]}, {"id": "b2-13", "source_ref": "int-b2", "class": "reported", "kind": "quote", "text": "Die Person durfte mir zuerst nichts sagen, weil die Firma als Ansprechpartnerin eingetragen war. Für mein eigenes Haus.", "locator": "Zeile 24", "signal": "breakdown", "phase_hint": "warten", "channel_hint": "phone", "persona_hint": "erstbauherrschaft", "tags": ["vermittlung"]}, {"id": "b2-14", "source_ref": "int-b2", "class": "reported", "kind": "quote", "text": "Das war der Moment, in dem ich mich am meisten ausgeschlossen gefühlt habe.", "locator": "Zeile 25", "signal": "breakdown", "phase_hint": "warten", "persona_hint": "erstbauherrschaft", "emotion_hint": {"valence": -2, "label": "ausgeschlossen", "explicit": true}}, {"id": "b2-15", "source_ref": "int-b2", "class": "reported", "kind": "quote", "text": "Die Wärmepumpe läuft, sie ist leiser als ich dachte. Mit dem Nachbarn ist es wieder gut, aber es hat gedauert.", "locator": "Zeile 27", "signal": "positive", "phase_hint": "umsetzung", "persona_hint": "erstbauherrschaft", "emotion_hint": {"valence": 1, "label": "erleichtert; mit dem Nachbarn wieder gut", "explicit": false}}, {"id": "b2-16", "source_ref": "int-b2", "class": "reported", "kind": "quote", "text": "Eine Kopie von allem, was an die Firma geht.", "locator": "Zeile 29", "signal": "need", "phase_hint": "warten", "persona_hint": "erstbauherrschaft"}, {"id": "b2-17", "source_ref": "int-b2", "class": "reported", "kind": "quote", "text": "Reden Sie mit den Nachbarn, bevor Sie einreichen.", "locator": "Zeile 29", "signal": "need", "phase_hint": "orientierung", "persona_hint": "erstbauherrschaft"}, {"id": "anf-02", "source_ref": "anfragen", "class": "observed", "kind": "observation", "text": "Braucht der Ersatz der Ölheizung durch eine Wärmepumpe eine Bewilligung? Website sagt «kommt darauf an».", "locator": "anfrage_id B-001", "signal": "friction", "phase_hint": "orientierung", "channel_hint": "phone", "persona_hint": "erstbauherrschaft"}, {"id": "anf-03", "source_ref": "anfragen", "class": "observed", "kind": "observation", "text": "Heizung ausgefallen, Wärmepumpe soll sofort eingebaut werden. Gibt es ein schnelleres Verfahren?", "locator": "anfrage_id B-007", "signal": "need", "phase_hint": "orientierung", "persona_hint": "erstbauherrschaft"}, {"id": "anf-05", "source_ref": "anfragen", "class": "observed", "kind": "observation", "text": "Gesuch zurückgewiesen wegen Lärmschutznachweis. Bitte Vorlage mit Beispiel zusenden.", "locator": "anfrage_id B-010", "signal": "breakdown", "phase_hint": "gesuch", "persona_hint": "erstbauherrschaft"}, {"id": "anf-06", "source_ref": "anfragen", "class": "observed", "kind": "observation", "text": "Bitte um Vorprüfung des Lärmschutznachweises vor dem Einreichen.", "locator": "anfrage_id B-027", "signal": "need", "phase_hint": "gesuch", "persona_hint": "erstbauherrschaft"}, {"id": "anf-08", "source_ref": "anfragen", "class": "observed", "kind": "observation", "text": "Status im Portal unverändert seit sechs Wochen. Ist das Gesuch verloren gegangen?", "locator": "anfrage_id B-014", "signal": "friction", "phase_hint": "warten", "channel_hint": "phone", "persona_hint": "erstbauherrschaft"}, {"id": "anf-09", "source_ref": "anfragen", "class": "observed", "kind": "observation", "text": "Gesuch seit Oktober hängig, Haus wird mit Elektroöfen geheizt. Gibt es eine Möglichkeit zur Beschleunigung?", "locator": "anfrage_id B-029", "signal": "workaround", "phase_hint": "warten", "channel_hint": "phone", "persona_hint": "erstbauherrschaft"}, {"id": "anf-10", "source_ref": "anfragen", "class": "observed", "kind": "observation", "text": "Firma hat Gesuch eingereicht, Eigentümer möchte Stand wissen. Keine Auskunft ohne Vollmacht möglich.", "locator": "anfrage_id B-008", "signal": "breakdown", "phase_hint": "warten", "channel_hint": "phone", "persona_hint": "erstbauherrschaft"}, {"id": "anf-11", "source_ref": "anfragen", "class": "observed", "kind": "observation", "text": "Eigentümerin erhält keine Kopien der Schreiben, alles geht an die Firma. Möchte informiert werden.", "locator": "anfrage_id B-018", "signal": "need", "phase_hint": "warten", "persona_hint": "erstbauherrschaft"}, {"id": "anf-12", "source_ref": "anfragen", "class": "observed", "kind": "observation", "text": "Was kostet die Bewilligung für eine Wärmepumpe ungefähr? Muss es der Bank für die Finanzierung angeben.", "locator": "anfrage_id B-011", "signal": "need", "phase_hint": "entscheid", "channel_hint": "phone", "persona_hint": "erstbauherrschaft"}, {"id": "anf-13", "source_ref": "anfragen", "class": "observed", "kind": "observation", "text": "Gebühr im Entscheid höher als erwartet. Wie setzt sie sich zusammen?", "locator": "anfrage_id B-022", "signal": "friction", "phase_hint": "entscheid", "persona_hint": "erstbauherrschaft"}, {"id": "anf-14", "source_ref": "anfragen", "class": "observed", "kind": "observation", "text": "Einsprache erhalten. Was passiert jetzt, und wie lange verzögert sich alles?", "locator": "anfrage_id B-025", "signal": "friction", "phase_hint": "warten", "channel_hint": "phone", "persona_hint": "erstbauherrschaft"}, {"id": "anf-16", "source_ref": "anfragen", "class": "observed", "kind": "observation", "text": "Portal akzeptiert das Datenblatt im PDF nicht, Upload bricht ab.", "locator": "anfrage_id B-026", "signal": "friction", "phase_hint": "gesuch", "channel_hint": "phone", "persona_hint": "erstbauherrschaft"}, {"id": "anf-17", "source_ref": "anfragen", "class": "observed", "kind": "observation", "text": "Wie melde ich die Fertigstellung der Anlage?", "locator": "anfrage_id B-030", "signal": "need", "phase_hint": "umsetzung", "persona_hint": "erstbauherrschaft"}, {"id": "anf-18", "source_ref": "anfragen", "class": "observed", "kind": "observation", "text": "Brief erhalten, Gesuch unvollständig. Welche Unterlagen fehlen genau? Installateur nicht erreichbar.", "locator": "anfrage_id B-006", "signal": "breakdown", "phase_hint": "gesuch", "channel_hint": "phone", "persona_hint": "erstbauherrschaft"}, {"id": "anf-01", "source_ref": "anfragen", "class": "observed", "kind": "metric", "text": "7 von 30 Anfragen betreffen die Bewilligungspflicht (B-001, B-002, B-007, B-013, B-019, B-023, B-028) – zusammen mit den Statusfragen die häufigste Kategorie.", "locator": "Spalte kategorie = bewilligungspflicht", "value": 23, "unit": "% der Anfragen", "signal": "friction", "phase_hint": "orientierung", "persona_hint": "erstbauherrschaft"}, {"id": "anf-04", "source_ref": "anfragen", "class": "observed", "kind": "metric", "text": "7 von 30 Anfragen betreffen Unterlagen oder den Lärmschutznachweis; 4 davon stellen Installationsfirmen.", "locator": "Spalte kategorie = laermnachweis oder unterlagen", "value": 23, "unit": "% der Anfragen", "signal": "friction", "phase_hint": "gesuch", "persona_hint": "erstbauherrschaft"}, {"id": "anf-07", "source_ref": "anfragen", "class": "observed", "kind": "metric", "text": "7 von 30 Anfragen sind Statusfragen während der Prüfung (B-004, B-009, B-014, B-017, B-021, B-025, B-029).", "locator": "Spalte kategorie = status", "value": 23, "unit": "% der Anfragen", "signal": "friction", "phase_hint": "warten", "persona_hint": "erstbauherrschaft"}, {"id": "stat-02", "source_ref": "statistik", "class": "observed", "kind": "metric", "text": "37 % der Gesuche tragen den Vermerk «Ersatz nach Ausfall».", "locator": "Zeile 3", "value": 37, "unit": "% der Gesuche", "signal": "breakdown", "phase_hint": "orientierung", "contradicts": ["ws-02"]}, {"id": "stat-03", "source_ref": "statistik", "class": "observed", "kind": "metric", "text": "58 % der Gesuche reicht eine Installationsfirma als Vertreterin ein.", "locator": "Zeile 4", "value": 58, "unit": "% der Gesuche", "signal": "neutral", "phase_hint": "gesuch"}, {"id": "stat-04", "source_ref": "statistik", "class": "observed", "kind": "metric", "text": "41 % der Gesuche werden mindestens einmal wegen Unvollständigkeit zurückgewiesen.", "locator": "Zeile 5", "value": 41, "unit": "% der Gesuche", "signal": "breakdown", "phase_hint": "gesuch"}, {"id": "stat-05", "source_ref": "statistik", "class": "observed", "kind": "metric", "text": "Bei 63 % der Rückweisungen fehlt der Lärmschutznachweis oder ist fehlerhaft.", "locator": "Zeile 6", "value": 63, "unit": "% der Rückweisungen", "signal": "breakdown", "phase_hint": "gesuch"}, {"id": "stat-06", "source_ref": "statistik", "class": "observed", "kind": "metric", "text": "Vollständigkeitsprüfung im Median 17 Arbeitstage vom Eingang bis zur Mitteilung.", "locator": "Zeile 7", "value": 17, "unit": "Arbeitstage", "signal": "friction", "phase_hint": "gesuch", "contradicts": ["doc-01"]}, {"id": "stat-07", "source_ref": "statistik", "class": "observed", "kind": "metric", "text": "Durchlaufzeit ohne Einsprache im Median 38 Kalendertage ab vollständigem Gesuch.", "locator": "Zeile 8", "value": 38, "unit": "Kalendertage", "signal": "neutral", "phase_hint": "warten"}, {"id": "stat-08", "source_ref": "statistik", "class": "observed", "kind": "metric", "text": "Durchlaufzeit mit Einsprache im Median 112 Kalendertage ab vollständigem Gesuch.", "locator": "Zeile 9", "value": 112, "unit": "Kalendertage", "signal": "friction", "phase_hint": "entscheid", "contradicts": ["doc-05"]}, {"id": "stat-09", "source_ref": "statistik", "class": "observed", "kind": "metric", "text": "14 % der Gesuche erhalten mindestens eine Einsprache.", "locator": "Zeile 10", "value": 14, "unit": "% der Gesuche", "signal": "friction", "phase_hint": "warten"}, {"id": "stat-10", "source_ref": "statistik", "class": "observed", "kind": "metric", "text": "67 % der Einsprachen werden nach einer Einigungsverhandlung zurückgezogen.", "locator": "Zeile 11", "value": 67, "unit": "% der Einsprachen", "signal": "positive", "phase_hint": "entscheid"}, {"id": "stat-11", "source_ref": "statistik", "class": "observed", "kind": "metric", "text": "Bewilligungsgebühr im Median CHF 720 inklusive Publikation.", "locator": "Zeile 12", "value": 720, "unit": "CHF", "signal": "neutral", "phase_hint": "entscheid"}, {"id": "stat-12", "source_ref": "statistik", "class": "observed", "kind": "metric", "text": "3 Lärmklagen bei 71 in Betrieb genommenen Anlagen.", "locator": "Zeile 13", "value": 4.2, "unit": "Klagen je 100 Anlagen", "signal": "neutral", "phase_hint": "umsetzung"}, {"id": "web-01", "source_ref": "analytics", "class": "observed", "kind": "metric", "text": "Seite «Braucht es eine Bewilligung?»: 9420 Aufrufe, Ausstiegsrate 58 %.", "locator": "Zeile 2", "value": 58, "unit": "% Ausstiegsrate", "signal": "friction", "phase_hint": "orientierung", "channel_hint": "web"}, {"id": "web-03", "source_ref": "analytics", "class": "observed", "kind": "metric", "text": "Gesuchsformular im Portal: Ausstiegsrate 44 %, durchschnittlich 610 Sekunden.", "locator": "Zeile 4", "value": 44, "unit": "% Ausstiegsrate", "signal": "friction", "phase_hint": "gesuch", "channel_hint": "web"}, {"id": "web-04", "source_ref": "analytics", "class": "observed", "kind": "metric", "text": "Statusseite im Portal: 7960 Aufrufe bei 84 Gesuchen, Ausstiegsrate 71 %, durchschnittlich 22 Sekunden.", "locator": "Zeile 5", "value": 7960, "unit": "Aufrufe", "signal": "friction", "phase_hint": "warten", "channel_hint": "web"}, {"id": "doc-01", "source_ref": "prozessdok", "class": "assumed", "kind": "document_excerpt", "text": "Die Vollständigkeitsprüfung erfolgt innert zehn Arbeitstagen nach Eingang.", "locator": "Zeile 22", "signal": "neutral", "phase_hint": "gesuch"}, {"id": "doc-02", "source_ref": "prozessdok", "class": "assumed", "kind": "document_excerpt", "text": "Ist eine Vertretung bezeichnet, erfolgt die gesamte Korrespondenz an die Vertretung.", "locator": "Zeile 24", "signal": "neutral", "phase_hint": "warten"}, {"id": "doc-03", "source_ref": "prozessdok", "class": "assumed", "kind": "document_excerpt", "text": "Die Gesuchstellenden werden über die Publikation schriftlich informiert.", "locator": "Zeile 28", "signal": "neutral", "phase_hint": "warten"}, {"id": "doc-05", "source_ref": "prozessdok", "class": "assumed", "kind": "document_excerpt", "text": "Ordentliche Verfahren werden innert zwei Monaten nach Vollständigkeit entschieden.", "locator": "Zeile 34", "signal": "neutral", "phase_hint": "entscheid"}, {"id": "ws-01", "source_ref": "workshop", "class": "assumed", "kind": "workshop_statement", "text": "Annahme: Gesuchstellende für Wärmepumpen werden vom Installateur vollständig begleitet und erleben das Verfahren kaum.", "locator": "Zeile 11", "signal": "neutral", "phase_hint": "gesuch"}, {"id": "ws-02", "source_ref": "workshop", "class": "assumed", "kind": "workshop_statement", "text": "Annahme: Die Wartezeit ist unproblematisch, weil ein Heizungsersatz in der Regel geplant erfolgt.", "locator": "Zeile 12", "signal": "neutral", "phase_hint": "warten", "emotion_hint": {"valence": 0, "label": "unproblematisch", "explicit": false}}, {"id": "ws-04", "source_ref": "workshop", "class": "assumed", "kind": "workshop_statement", "text": "Annahme: Die Gebühr spielt neben den Kosten der Anlage keine Rolle.", "locator": "Zeile 14", "signal": "neutral", "phase_hint": "entscheid"}, {"id": "ws-05", "source_ref": "workshop", "class": "assumed", "kind": "workshop_statement", "text": "Annahme: Der Status im Portal genügt als Information während der Prüfung.", "locator": "Zeile 15", "signal": "neutral", "phase_hint": "warten"}, {"id": "ws-06", "source_ref": "workshop", "class": "assumed", "kind": "workshop_statement", "text": "Phasen aus Sicht des Teams: Eingang – Vollständigkeitsprüfung – Publikation – Fachprüfung – Entscheid – Baukontrolle.", "locator": "Zeile 7", "signal": "neutral"}], "open_questions": [{"text": "Sind Gesuchstellende, die alles selbst einreichen, und solche, die die Installationsfirma vertreten lässt, zwei Personas? Beide warten, aber nur die zweiten sind von Information ausgeschlossen.", "phase_ref": "warten", "proposed_method": "interview"}, {"text": "Wie erleben Installationsfirmen das Verfahren? Sie füllen die Formulare aus, kommen in der Journey aber nur als Gegenüber vor.", "phase_ref": "gesuch", "proposed_method": "interview"}, {"text": "Wie verteilen sich die Statusanfragen über die Wartezeit – gibt es einen Zeitpunkt, an dem eine Mitteilung die meisten Anrufe ersetzen würde?", "phase_ref": "warten", "proposed_method": "ticket_analysis"}], "changelog": [{"version": "0.1", "date": "2026-03-12", "summary": "Hypothesen-Workshop ohne Gesuchstellende: Phasen nach Verwaltungsablauf, keine Nutzerevidenz.", "author": "Bauberatung"}, {"version": "1.0", "date": "2026-10-01", "summary": "Zwei Interviews, Anfragen-Export, Gesuchsstatistik und Webanalytics eingearbeitet; Phasen aus Nutzersicht neu geschnitten; Kennzahlen hinterlegt; Chancen priorisiert.", "author": "Bauberatung"}]}, {"schema_version": "1.0", "meta": {"id": "baubewilligung-waermepumpe-nachbarschaft", "title": "Baubewilligung für eine Wärmepumpe aus Sicht der Nachbarschaft", "version": "0.2", "status": "draft", "map_type": "user_journey", "diagnosis": {"rationale": "Dieselbe Leistung aus Sicht einer Drittperson mit eigenem Rechtsanspruch und gegenläufigem Interesse. Eigene Datei, weil Bauherrschaft und Nachbarschaft an derselben Stelle gegensätzlich fühlen. Phasen-IDs stimmen mit der Bauherrschaft überein, wo sich die Zeiträume decken, damit der Viewer die Kurven überlagern kann.", "alternatives_considered": ["Nachbarschaft als Edge Case in der Bauherrschafts-Journey: verliert die eigene Gefühlskurve und den eigenen Kanal (Schalter, Einsprache)."]}, "language": "de", "created": "2026-09-20", "updated": "2026-10-01", "owner": {"role": "Leitung Bauberatung", "unit": "Bauamt, Bauberatung", "contact": "Funktionsadresse"}, "review_cycle_days": 180, "next_review": "2027-04-30", "context": {"organisation": "Gemeinde Musterau, Bauamt (fiktives Beispiel)", "domain": "public_administration", "service": "Baubewilligung Wärmepumpe (ordentliches Verfahren)", "notes": "Synthetisches Beispiel zur Prüfung der Übertragbarkeit. Verfahren, Rollen, Zahlen und Zitate sind erfunden und stark vereinfacht; kein Abbild eines realen kantonalen oder kommunalen Baubewilligungsverfahrens."}, "synthetic": true}, "persona": {"id": "nachbarschaft", "name": "Direkte Nachbarschaft", "role": "Anstösserin oder Anstösser", "description": "Wohnt im Nachbarhaus, oft mit Schlafzimmer oder Sitzplatz zur Grenze. Hat keinen Anlass, Amtsblatt oder Publikationen zu verfolgen, und ist nicht gegen Wärmepumpen – will aber wissen, ob es nachts laut wird.", "goals": ["Rechtzeitig erfahren, was nebenan gebaut wird", "Beurteilen können, ob es mich stört", "Kein Streit mit den Nachbarn"], "frustrations": ["Pläne, die nur Fachleute lesen können", "Einsprache als einziger Weg zu einer Antwort"], "context": {"language_situation": "Deutsch als Erstsprache; Lärmwerte und Baurecht sind fremd.", "digital_access": "Liest keine Online-Publikationen; geht für Akteneinsicht an den Schalter.", "time_budget": "Pensioniert, tagsüber meist zu Hause.", "prior_experience": "Keine Erfahrung mit Einsprachen."}, "evidence_refs": ["n1-01", "n1-06", "anf-n5"], "is_hypothesis": true}, "scenario": {"title": "Von der Publikation bis zur laufenden Anlage nebenan", "goal": "Ich will wissen, was nebenan gebaut wird und ob es mich nachts stört – ohne mich mit den Nachbarn zu zerstreiten.", "trigger": "Ein Hinweis aus dem Bekanntenkreis, dass nebenan etwas publiziert ist.", "end_state": "Die Anlage läuft, und die Persona weiss, an wen sie sich wenden kann, wenn es lauter wird.", "timeframe": "Auflagefrist von 20 Tagen bis einige Monate nach Inbetriebnahme", "scope_exclusions": ["Rechtsmittel nach dem Entscheid", "Mietende ohne Einspracherecht"], "evidence_refs": ["n1-01"]}, "phases": [{"id": "warten", "name": "Auflage: erfahren, einsehen, Einsprache", "description": "Für die Bauherrschaft die Wartezeit, für die Nachbarschaft die einzige Phase, in der sie handeln kann.", "user_intent": "Verstehen, was nebenan entsteht, und ob ich etwas tun muss.", "duration": "20 Tage Auflagefrist", "kpis": [{"name": "Anteil Anfragen aus der Nachbarschaft", "category": "outcome", "indicator_type": "leading", "definition": "Anteil der Anfragen an die Bauberatung, die von Nachbarinnen und Nachbarn kommen.", "unit": "% der Anfragen", "current_value": 13, "target": 10, "source_ref": "anf-n5"}], "steps": [{"id": "n-erfahren", "name": "Vom Vorhaben erfahren", "action": "Die Persona erfährt zufällig aus dem Bekanntenkreis, dass nebenan eine Wärmepumpe publi rce_ref": "int-n1", "class": "reported", "kind": "quote", "text": "Es gab kein Baugespann, nichts. Bei einer Garage stehen Stangen, bei einer Wärmepumpe sieht man gar nichts.", "locator": "Zeile 8", "signal": "breakdown", "phase_hint": "warten", "persona_hint": "nachbarschaft", "contradicts": ["doc-04"]}, {"id": "n1-03", "source_ref": "int-n1", "class": "reported", "kind": "quote", "text": "Ich bin auf die Gemeinde gegangen, um die Pläne anzuschauen. Die Auflagefrist war schon zur Hälfte vorbei.", "locator": "Zeile 10", "signal": "friction", "phase_hint": "warten", "channel_hint": "counter", "persona_hint": "nachbarschaft"}, {"id": "n1-04", "source_ref": "int-n1", "class": "reported", "kind": "quote", "text": "Die Pläne habe ich nicht verstanden. Ein Punkt auf dem Situationsplan und eine Tabelle mit Dezibel. Ob das laut ist oder nicht, konnte ich nicht beurteilen.", "locator": "Zeile 11", "signal": "friction", "phase_hint": "warten", "channel_hint": "counter", "persona_hint": "nachbarschaft"}, {"id": "n1-05", "source_ref": "int-n1", "class": "reported", "kind": "quote", "text": "Die Frau am Schalter war freundlich, aber sie durfte mir nicht sagen, ob das in Ordnung ist.", "locator": "Zeile 13", "signal": "friction", "phase_hint": "warten", "channel_hint": "counter", "persona_hint": "nachbarschaft"}, {"id": "n1-06", "source_ref": "int-n1", "class": "reported", "kind": "quote", "text": "Nicht weil ich gegen die Wärmepumpe bin, sondern weil ich sonst keine Möglichkeit hatte, eine Antwort zu bekommen.", "locator": "Zeile 14", "signal": "workaround", "phase_hint": "warten", "persona_hint": "nachbarschaft", "contradicts": ["ws-03"]}, {"id": "n1-07", "source_ref": "int-n1", "class": "reported", "kind": "quote", "text": "Ich habe zwei Abende daran gesessen, weil ich nicht wusste, was hineingehört.", "locator": "Zeile 16", "signal": "friction", "phase_hint": "warten", "channel_hint": "letter", "persona_hint": "nachbarschaft"}, {"id": "n1-08", "source_ref": "int-n1", "class": "reported", "kind": "quote", "text": "Ich hatte Angst, dass die Nachbarn jetzt denken, ich sei die schwierige Alte.", "locator": "Zeile 17", "signal": "friction", "phase_hint": "warten", "persona_hint": "nachbarschaft", "emotion_hint": {"valence": -1, "label": "Angst, als schwierig zu gelten", "explicit": true}}, {"id": "n1-09", "source_ref": "int-n1", "class": "reported", "kind": "quote", "text": "Zum ersten Mal hat mir jemand die Zahlen erklärt.", "locator": "Zeile 19", "signal": "positive", "phase_hint": "entscheid", "channel_hint": "in_person", "persona_hint": "nachbarschaft"}, {"id": "n1-10", "source_ref": "int-n1", "class": "reported", "kind": "quote", "text": "Ich habe die Einsprache zurückgezogen und war erleichtert.", "locator": "Zeile 20", "signal": "positive", "phase_hint": "entscheid", "persona_hint": "nachbarschaft", "emotion_hint": {"valence": 1, "label": "erleichtert", "explicit": true}}, {"id": "n1-11", "source_ref": "int-n1", "class": "reported", "kind": "quote", "text": "Man hört sie, wenn es still ist. Aber es ist in Ordnung.", "locator": "Zeile 22", "signal": "neutral", "phase_hint": "umsetzung", "persona_hint": "nachbarschaft", "emotion_hint": {"valence": 0, "label": "in Ordnung", "explicit": false}}, {"id": "n1-12", "source_ref": "int-n1", "class": "reported", "kind": "quote", "text": "Ich weiss jetzt, an wen ich mich wenden kann, wenn es lauter wird. Das wusste ich vorher nicht.", "locator": "Zeile 22", "signal": "need", "phase_hint": "umsetzung", "persona_hint": "nachbarschaft"}, {"id": "n1-13", "source_ref": "int-n1", "class": "reported", "kind": "quote", "text": "Wenn mir jemand vor der Auflage erklärt hätte, was das für mich bedeutet. Ein Brief an die direkten Nachbarn, in normaler Sprache.", "locator": "Zeile 24", "signal": "need", "phase_hint": "warten", "persona_hint": "nachbarschaft"}, {"id": "anf-n1", "source_ref": "anfragen", "class": "observed", "kind": "observation", "text": "Möchte Pläne der Wärmepumpe nebenan einsehen. Versteht // ---------------------------------------------------------------- Modell
class Idx {
  constructor(j) {
    this.j = j; this.ev = new Map(); this.src = new Map(); this.steps = []; this.pp = new Map(); this.ppStep = new Map(); this.opps = j.opportunities || [];
    (j.evidence || []).forEach(a => this.ev.set(a.id, a));
    (j.sources || []).forEach(s => this.src.set(s.id, s));
    j.phases.forEach((p, pi) => p.steps.forEach((s, si) => {
      this.steps.push({ step: s, phase: p, pi, si, gi: this.steps.length });
      (s.pain_points || []).forEach(pp => { this.pp.set(pp.id, pp); this.ppStep.set(pp.id, s.id); });
    }));
  }
  classes(refs) { const out = { observed: 0, reported: 0, assumed: 0, missing: 0 }; (refs || []).forEach(r => { const a = this.ev.get(r); if (a) out[a.class]++; else out.missing++; }); return out; }
  hasPrimary(refs) { return (refs || []).some(r => PRIMARY.has(this.ev.get(r)?.class)); }
  evState(refs) { if (!refs || !refs.length) return "none"; return this.hasPrimary(refs) ? "primary" : "assumed"; }
  summary() { const s = { observed: 0, reported: 0, assumed: 0, total: 0 }; this.ev.forEach(a => { s[a.class]++; s.total++; }); return s; }
  oppsFor(ppId) { return this.opps.filter(o => (o.linked_pain_points || []).includes(ppId)); }
  oppsForPhase(phaseId) { return this.opps.filter(o => { if (o.phase_ref) return o.phase_ref === phaseId; const st = this.ppStep.get((o.linked_pain_points || [])[0]); const e = this.steps.find(x => x.step.id === st); return e && e.phase.id === phaseId; }); }
  claims() { // für Heatmap und Quoten
    const out = [];
    this.steps.forEach(e => { const s = e.step; out.push({ kind: "step", refs: s.evidence_refs || [], e });
      (s.thinking || []).forEach(t => out.push({ kind: "thinking", refs: t.evidence_refs || [], e }));
      if (s.feeling) out.push({ kind: "feeling", refs: s.feeling.evidence_refs || [], e });
      (s.pain_points || []).forEach(p => out.push({ kind: "pain_point", refs: p.evidence_refs || [], e }));
      (s.edge_cases || []).forEach(p => out.push({ kind: "edge_case", refs: p.evidence_refs || [], e }));
      (s.recovery_paths || []).forEach(p => out.push({ kind: "recovery", refs: p.evidence_refs || [], e })); });
    return out;
  }
}
function quadrant(o) { if (o.user_impact == null || o.effort == null) return null; const v = o.user_impact + (o.public_value ?? o.user_impact); const hv = v >= 6, le = o.effort <= 2; return hv && le ? "quick_win" : hv ? "big_bet" : le ? "fill_in" : "skip"; }

function claimBtn(idx, text, refs, extraCls, title) { const st = idx.evState(refs); return '<button class="claim ev-' + st + ' ' + (extraCls || "") + '" data-refs="' + esc((refs || []).join(",")) + '" data-title="' + esc(title || "") + '" data-text="' + esc(text) + '">' + esc(text) + (refs && refs.length ? evDots(idx, refs) : '<span class="evc muted" title="' + t("noEvidence") + '">∅</span>') + '</button>'; }

  const row = (label, sub, cells, cls) => { h += '<div class="rowlabel">' + label + (sub ? '<small>' + sub + '</small>' : '') + '</div>'; h += cells; };
  // Phasen

  j.phases.forEach(p => { h += '<div class="phase" style="grid-column: span ' + p.steps.length + '"><h3>' + esc(p.name) + '</h3>' + (p.user_intent ? '<div class="intent">' + esc(p.user_intent) + '</div>' : '') + (p.duration ? '<div class="dur">' + esc(p.duration) + '</div>' : '') + '</div>'; });

        c = '<div class="dbar" title="' + esc(label) + '"><span class="typ" style="width:' + px(d.typical) + 'px"></span>' + (hi > lo ? '<span class="rng" style="left:' + px(lo) + 'px;width:' + (px(hi) - px(lo)) + 'px"></span>' : '') + '</div>'
          + claimBtn(idx, label, d.evidence_refs, "", t("durTitle", { p: p.name })) + (d.basis ? '<div class="dbasis">' + esc(d.basis) + '</div>' : ''); }

    cells += '<div class="step' + (last ? ' phase-end' : '') + '"><h4>' + esc(s.name) + '</h4><div class="action">' + esc(s.action) + '</div><div class="meta">'
      + (s.channel ? '<span class="chip">' + (L.channels[s.channel] || s.channel) + '</span>' : '') + (s.touchpoint ? '<span class="chip" title="' + t("touchpoint") + '">' + esc(s.touchpoint) + '</span>' : '') + (s.counterpart ? '<span class="chip" title="' + t("counterpart") + '">' + esc(s.counterpart) + '</span>' : '') + actorChip(s) + (s.is_transition ? '<span class="chip transition">' + t("transition") + '</span>' : '')
      + '</div>' + ((s.evidence_refs || []).length ? '<div style="margin-top:6px">' + claimBtn(idx, t("stepEvidence"), s.evidence_refs, "", s.name) + '</div>' : '') + '</div>'; });
  row(t("rowDoes"), t("rowDoesSub"), cells);

  h += '<div class="curve" style="grid-column: 2 / -1" id="curve"></div>';
  // Pain Points
  cells = ""; idx.steps.forEach(e => { const pps = e.step.pain_points || []; let c = "", hidden = 0; pps.forEach(pp => { if (!visible(idx, pp.evidence_refs)) { hidden++; return; }
      const sev = pp.severity ? '<span class="sev" title="' + t("severity", { n: pp.severity }) + '">' + [1, 2, 3, 4, 5].map(i => '<i class="' + (i <= pp.severity ? 'on' : '') + '"></i>').join("") + '</span>' : '';

  h += '</div>';
  const oq = idx.j.open_questions || [];
  h += '<div class="grid-2"><div class="panel"><h2>' + t("openQuestions", { n: oq.length }) + '</h2>' + (oq.length ? '<ul style="margin:0;padding-left:18px">' + oq.map(q => '<li>' + esc(q.text) + (q.proposed_method ? ' <span class="badge">' + esc(q.proposed_method) + '</span>' : '') + '</li>').join("") + '</ul>' : '<p class="muted">' + t("none") + '</p>') + '</div>';
  const chl = idx.j.changelog || [];
  h += '<div class="panel"><h2>' + t("versions") + '</h2>' + (chl.length ? '<table>' + chl.map(c => '<tr><th>v' + esc(c.version) + '</th><td>' + esc(c.date) + '</td><td>' + esc(c.summary) + '</td></tr>').join("") + '</table>' : '<p class="muted">' + t("noChangelog") + '</p>') + '</div></div>';
  return h;
}

// ---------------------------------------------------------------- Drawer
function openDrawer(title, text, refs) {
  const idx = IDX, atoms = (refs || "").split(",").filter(Boolean).map(r => idx.ev.get(r) || { id: r, missing: true });
  $("#dTitle").textContent = title || t("evidence");
  const c = idx.classes(atoms.filter(a => !a.missing).map(a => a.id));
  let v;
  if (!atoms.length) v = '<div class="verdict n">' + t("verdictNone") + '</div>';
  else if (c.observed + c.reported > 0) v = '<div class="verdict p">' + t("verdictPrimary", { list: [c.observed ? t("verdictObs", { n: c.observed }) : "", c.reported ? t("verdictRep", { n: c.reported }) : ""].filter(Boolean).join(t("and")), extra: c.assumed ? t("verdictExtra", { n: c.assumed }) : "" }) + '</div>';
  else v = '<div class="verdict a">' + t("verdictAssumed", { n: c.assumed }) + '</div>';
  $("#dBody").innerHTML = '<div class="claim-txt">' + esc(text) + '</div>' + v + atoms.map(a => a.missing ? '<div class="atom c-breakdown">' + esc(t("unknownRef", { id: a.id })) + '</div>' : atomHtml(idx, a)).join("");
  $("#drawer").classList.add("open"); $("#scrim").classList.add("open");
}
function closeDrawer() { $("#drawer").classList.remove("open"); $("#scrim").classList.remove("open"); }

// ---------------------------------------------------------------- Render
function render() {
  IDX = new Idx(journeys[state.j]); renderHeader();
  const m = $("#main");
  m.innerHTML = '<section class="layer' + (state.tab === "journey" ? " active" : "") + '" data-l="journey">' + renderJourney(IDX) + '</section>'
    + '<section class="layer' + (state.tab === "process" ? " active" : "") + '" data-l="process">' + renderProcess(IDX) + '</section>'
    + '<section class="layer' + (state.tab === "evidence" ? " active" : "") + '" data-l="evidence">' + renderEvidence(IDX) + '</section>'
    + '<section class="layer' + (state.tab === "opps" ? " active" : "") + '" data-l="opps">' + renderOpps(IDX) + '</section>'
    + '<section class="layer' + (state.tab === "audit" ? " active" : "") + '" data-l="audit">' + renderAudit(IDX) + '</section>';
  const meta = journeys[state.j].meta;
  $("#footer").textContent = (meta.context?.organisation ? meta.context.organisation + " · " : "") + (meta.context?.service || "") + (meta.updated ? " · " + t("asOf", { d: meta.updated }) : "") + " · " + DATA.generator;
  requestAnimationFrame(() => drawCurve(IDX));
}
function showTab(t) { state.tab = t; document.querySelectorAll("section.layer").forEach(s => s.classList.toggle("active", s.dataset.l === t)); document.querySelectorAll("nav.tabs button").forEach(b => b.classList.toggle("active", b.dataset.tab === t)); if (t === "journey") requestAnimationFrame(() => drawCurve(IDX)); }

document.addEventListener("click", ev => {
  const tab = ev.target.closest("nav.tabs button"); if (tab) return showTab(tab.dataset.tab);
  const cl = ev.target.closest("[data-refs]"); if (cl) return openDrawer(cl.dataset.title, cl.dataset.text, cl.dataset.refs);
  const op = ev.target.closest(".matrix .opp"); if (op) { const card = $("#opp-" + op.dataset.opp); card?.scrollIntoView({ behavior: "smooth", block: "center" }); card.style.borderColor = "var(--accent)"; setTimeout(() => card.style.borderColor = "", 1500); return; }
  if (ev.target.closest("#dClose") || ev.target.closest("#scrim")) closeDrawer();
});
document.addEventListener("keydown", ev => { if (ev.key === "Escape") closeDrawer(); });
$("#primOnly").addEventListener("change", ev => { state.primOnly = ev.target.checked; render(); });
$("#personaSel").addEventListener("change", ev => { state.j = +ev.target.value; render(); });
$("#themeBtn").addEventListener("click", () => { const r = document.documentElement, cur = r.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); r.dataset.theme = cur === "dark" ? "light" : "dark"; });
window.addEventListener("resize", () => drawCurve(IDX));
document.documentElement.lang = LANG;
document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
document.querySelectorAll("[data-i18n-title]").forEach(el => { el.title = t(el.dataset.i18nTitle); });
document.querySelectorAll("[data-i18n-aria]").forEach(el => { el.setAttribute("aria-label", t(el.dataset.i18nAria)); });

if (!DATA || !DATA.journeys?.length) { $("#main").innerHTML = '<div class="panel"><h2>' + t("noData") + '</h2><p>' + t("noDataText", { cmd: "<code>journeykit render journey.json</code>" }) + '</p></div>'; }
else render();
</script>
</body>
</html>
