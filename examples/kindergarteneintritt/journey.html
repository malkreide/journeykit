<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JourneyKit Viewer</title>
<meta name="description" content="Interaktive, evidenzbasierte User Journey: Journey-Layer, Prozess- und Fehlerpfade, Evidenz-Heatmap, Chancenmatrix und methodische Prüfung.">
<style>
:root {
  --bg: #f6f5f1; --surface: #ffffff; --surface-2: #efede7; --line: #d9d6cd; --line-strong: #b9b5a9;
  --ink: #1d1c1a; --ink-2: #5a5853; --ink-3: #8a877f;
  --accent: #2f4f7f; --accent-ink: #ffffff; --accent-soft: #e3eaf4;
  --observed: #1f7a8c; --observed-soft: #d9eef2; --reported: #6a4c93; --reported-soft: #e9e2f3; --assumed: #a07a2a; --assumed-soft: #f3ead6;
  --friction: #c47f17; --friction-soft: #fbead0; --breakdown: #b3261e; --breakdown-soft: #f8dcd9; --positive: #2e7d4f; --positive-soft: #d8eee0;
  --gap: #9c9a93; --shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.08);
  --radius: 10px; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --sans: "Inter", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15161a; --surface: #1e2026; --surface-2: #272a31; --line: #343842; --line-strong: #4a4f5b;
    --ink: #ebebe6; --ink-2: #b4b4ad; --ink-3: #85857f;
    --accent: #8fb0e0; --accent-ink: #0f1320; --accent-soft: #233044;
    --observed: #5fc3d6; --observed-soft: #173a42; --reported: #b79be0; --reported-soft: #33284a; --assumed: #e0b25a; --assumed-soft: #3f3418;
    --friction: #e5a24a; --friction-soft: #43301a; --breakdown: #ef7b73; --breakdown-soft: #4a1f1c; --positive: #6fcf93; --positive-soft: #1d3a29;
    --gap: #6e6e68; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"] {
  --bg: #15161a; --surface: #1e2026; --surface-2: #272a31; --line: #343842; --line-strong: #4a4f5b;
  --ink: #ebebe6; --ink-2: #b4b4ad; --ink-3: #85857f;
  --accent: #8fb0e0; --accent-ink: #0f1320; --accent-soft: #233044;
  --observed: #5fc3d6; --observed-soft: #173a42; --reported: #b79be0; --reported-soft: #33284a; --assumed: #e0b25a; --assumed-soft: #3f3418;
  --friction: #e5a24a; --friction-soft: #43301a; --breakdown: #ef7b73; --breakdown-soft: #4a1f1c; --positive: #6fcf93; --positive-soft: #1d3a29;
  --gap: #6e6e68; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.5);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0; font-weight: 600; letter-spacing: -0.01em; }
small, .muted { color: var(--ink-2); }
.mono { font-family: var(--mono); font-size: 12px; }

/* Kopf */
header.top { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-inner { padding: 12px 16px 0; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: flex-start; }
.title-block { flex: 1 1 320px; min-width: 0; }
.title-block h1 { font-size: 20px; line-height: 1.2; }
.title-block .sub { margin-top: 4px; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; color: var(--ink-2); }
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); font-size: 12px; white-space: nowrap; }
.badge.status-validated { border-color: var(--positive); color: var(--positive); background: var(--positive-soft); }
.badge.status-hypothesis, .badge.status-draft { border-color: var(--assumed); color: var(--assumed); background: var(--assumed-soft); }
.badge.synthetic { border-style: dashed; }
.badge.wrap { white-space: normal; max-width: 100%; border-radius: 10px; }
.badge.err { background: var(--breakdown-soft); color: var(--breakdown); border-color: var(--breakdown); }
.badge.warn { background: var(--friction-soft); color: var(--friction); border-color: var(--friction); }
.badge.ok { background: var(--positive-soft); color: var(--positive); border-color: var(--positive); }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.toggle { display: inline-flex; align-items: center; gap: 8px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer; user-select: none; }
.toggle input { accent-color: var(--accent); margin: 0; }
.toggle.active { border-color: var(--accent); background: var(--accent-soft); }
.btn { padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer; }
.btn:hover { border-color: var(--line-strong); }
select.persona { padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit; }
nav.tabs { display: flex; gap: 2px; padding: 8px 16px 0; overflow-x: auto; scrollbar-width: none; }
nav.tabs::-webkit-scrollbar { display: none; }
nav.tabs button { border: 0; background: transparent; padding: 8px 12px 10px; border-bottom: 2px solid transparent; color: var(--ink-2); white-space: nowrap; cursor: pointer; border-radius: 6px 6px 0 0; }
nav.tabs button:hover { color: var(--ink); background: var(--surface-2); }
nav.tabs button.active { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
nav.tabs button .n { margin-left: 6px; font-size: 11px; color: var(--ink-3); }
.evbar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; width: 160px; background: var(--surface-2); }
.evbar span { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--ink-2); align-items: center; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; border: 2px solid currentColor; vertical-align: -1px; }
.dot.fill { background: currentColor; }
.c-observed { color: var(--observed); } .c-reported { color: var(--reported); } .c-assumed { color: var(--assumed); } .c-gap { color: var(--gap); }

/* Layouts */
main { padding: 16px; max-width: 100%; }
section.layer { display: none; }
section.layer.active { display: block; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.panel + .panel { margin-top: 14px; }
.panel h2 { font-size: 15px; margin-bottom: 8px; }
.panel h3 { font-size: 13px; color: var(--ink-2); text-transform: uppercase; letter-spacing: .04em; margin: 14px 0 6px; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.tile { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; }
.tile .v { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
.tile .l { font-size: 12px; color: var(--ink-2); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--ink-2); font-weight: 600; font-size: 12px; }

/* Journey-Raster */
.map-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.map { display: grid; min-width: max-content; }
.map > div { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding: 10px 12px; min-width: 0; }
.map .rowlabel { position: sticky; left: 0; z-index: 3; background: var(--surface-2); font-size: 12px; font-weight: 600; color: var(--ink-2); text-transform: uppercase; letter-spacing: .04em; }
.map .rowlabel small { display: block; text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--ink-3); margin-top: 2px; }
.map .phase { background: var(--accent-soft); border-right: 2px solid var(--accent); }
.map .phase h3 { font-size: 14px; color: var(--ink); text-transform: none; letter-spacing: 0; margin: 0; }
.map .phase .intent { font-size: 12px; color: var(--ink-2); margin-top: 3px; }
.map .phase .dur { font-size: 11px; color: var(--ink-3); margin-top: 2px; }
.map .phase-end { border-right: 2px solid var(--accent); }
.dbar { position: relative; height: 14px; margin: 2px 0 6px; }
.dbar .typ { position: absolute; left: 0; top: 2px; height: 10px; border-radius: 2px; background: var(--accent); min-width: 2px; }
.dbar .rng { position: absolute; top: 6px; height: 2px; background: var(--ink-3); }
.dbar .rng::before, .dbar .rng::after { content: ""; position: absolute; top: -4px; width: 2px; height: 10px; background: var(--ink-3); }
.dbar .rng::before { left: 0; } .dbar .rng::after { right: 0; }
.dbasis { font-size: 11.5px; color: var(--ink-3); }
.step h4 { font-size: 13.5px; margin-bottom: 4px; }
.step .action { color: var(--ink-2); font-size: 13px; }
.step .meta { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px; border-radius: 6px; font-size: 11.5px; background: var(--surface-2); color: var(--ink-2); border: 1px solid transparent; }
.chip.transition { border-color: var(--friction); color: var(--friction); background: var(--friction-soft); }
.chip.actor { border-color: var(--line); border-style: dashed; }
.claim { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 8px 6px 10px; margin: 0 0 6px; cursor: pointer; position: relative; font-size: 13px; line-height: 1.35; }
.claim:hover { border-color: var(--accent); }
.claim::before { content: ""; position: absolute; left: 0; top: 6px; bottom: 6px; width: 3px; border-radius: 2px; background: var(--line-strong); }
.claim.ev-primary::before { background: linear-gradient(var(--observed), var(--reported)); }
.claim.ev-assumed { border-style: dashed; }
.claim.ev-assumed::before { background: var(--assumed); }
.claim.ev-none { border-style: dashed; color: var(--ink-2); }
.claim.ev-none::before { background: transparent; border-left: 3px dotted var(--gap); }
.claim .evc { display: inline-flex; gap: 3px; margin-left: 6px; vertical-align: middle; }
.claim .evc i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; }
.claim .evc i.o { background: var(--observed); } .claim .evc i.r { background: var(--reported); } .claim .evc i.a { background: var(--assumed); }
.claim.pp { padding-left: 12px; }
.claim.pp.friction::before { background: var(--friction); } .claim.pp.breakdown::before { background: var(--breakdown); }
.claim.pp .pp-head { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 3px; }
.tag { font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; font-weight: 700; padding: 1px 6px; border-radius: 4px; }
.tag.friction { background: var(--friction-soft); color: var(--friction); } .tag.breakdown { background: var(--breakdown-soft); color: var(--breakdown); }
.tag.status { background: var(--surface-2); color: var(--ink-2); font-weight: 600; text-transform: none; letter-spacing: 0; }
.sev { display: inline-flex; gap: 2px; }
.sev i { width: 6px; height: 6px; border-radius: 1px; background: var(--line-strong); display: inline-block; }
.sev i.on { background: var(--ink-2); }
.pp .wa { color: var(--ink-2); font-size: 12px; margin-top: 3px; }
.hidden-note { font-size: 11.5px; color: var(--ink-3); font-style: italic; padding: 4px 0; }
.empty { color: var(--ink-3); font-size: 12px; }
.kpi { font-size: 12.5px; padding: 4px 0; border-bottom: 1px dashed var(--line); }
.kpi:last-child { border-bottom: 0; }
.kpi b { font-weight: 600; }
.kpi .k { color: var(--ink-3); font-size: 11px; }

/* Gefühlskurve */
.curve { position: relative; height: 150px; padding: 0 !important; }
.curve svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.curve .zero { position: absolute; left: 0; right: 0; top: 50%; border-top: 1px dashed var(--line-strong); }
.curve .nodata { position: absolute; bottom: 3px; padding: 0 8px; font-size: 10.5px; line-height: 1.3; color: var(--ink-3); font-style: italic; text-align: center; pointer-events: none; }
.curve .dropped { position: absolute; top: 3px; right: 8px; max-width: 60%; font-size: 10.5px; color: var(--ink-3); font-style: italic; text-align: right; }
.curve .pt { position: absolute; width: 14px; height: 14px; border-radius: 50%; transform: translate(-50%, -50%); border: 2.5px solid var(--ink); background: var(--ink); cursor: pointer; z-index: 2; }
.curve .pt.hollow { background: var(--surface); border-style: solid; }
.curve .pt.assumed { border-color: var(--assumed); background: var(--surface); border-style: dashed; }
.curve .pt.gap { width: 18px; height: 18px; border: 2px dotted var(--gap); background: transparent; color: var(--gap); font-size: 11px; display: flex; align-items: center; justify-content: center; }
.curve .pt.other { width: 9px; height: 9px; border-width: 2px; opacity: .85; z-index: 1; }
.curve .lbl { position: absolute; transform: translateX(-50%); font-size: 11px; color: var(--ink-2); max-width: 180px; text-align: center; line-height: 1.25; pointer-events: none; background: color-mix(in srgb, var(--surface) 85%, transparent); padding: 1px 4px; border-radius: 4px; }
.curve .scale { position: absolute; left: 4px; font-size: 10px; color: var(--ink-3); }

/* Prozess-Layer */
.flow { display: flex; flex-direction: column; gap: 0; }
.flow .phase-h { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-2); margin: 18px 0 8px; display: flex; align-items: center; gap: 10px; }
.flow .phase-h::after { content: ""; flex: 1; border-top: 1px solid var(--line); }
.node-row { display: grid; grid-template-columns: minmax(240px, 1.1fr) minmax(0, 2fr); gap: 14px; align-items: start; position: relative; padding-left: 22px; }
.node-row::before { content: ""; position: absolute; left: 7px; top: 0; bottom: 0; border-left: 2px solid var(--line-strong); }
.node-row:last-child::before { bottom: 50%; }
.node { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; position: relative; }
.node::before { content: ""; position: absolute; left: -19px; top: 16px; width: 10px; height: 10px; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent); }
.node.has-breakdown { border-color: var(--breakdown); }
.node.has-breakdown::before { border-color: var(--breakdown); background: var(--breakdown); }
.node h4 { font-size: 13.5px; }
.node .act { color: var(--ink-2); font-size: 12.5px; margin-top: 2px; }
.branches { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
.branch { border-radius: 10px; padding: 8px 10px 8px 12px; border: 1px solid var(--line); position: relative; font-size: 12.5px; background: var(--surface); }
.branch.bd { border-color: var(--breakdown); background: var(--breakdown-soft); }
.branch.fr { border-color: var(--friction); background: var(--friction-soft); }
.branch.ec { border-left: 3px solid var(--assumed); }
.branch .arrow { display: flex; gap: 8px; align-items: flex-start; margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--line-strong); }
.branch .arrow .lab { font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; font-weight: 700; white-space: nowrap; padding-top: 1px; }
.branch .arrow.rec .lab { color: var(--positive); }
.branch .arrow.rec.soll { opacity: .85; } .branch .arrow.rec.soll .lab { color: var(--assumed); }
.branch .arrow.wa .lab { color: var(--breakdown); }

/* Evidenz-Layer */
.heat { overflow-x: auto; }
.heat table { min-width: max-content; }
.heat td.cell { text-align: center; padding: 0; }
.heat .hc { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 64px; height: 44px; margin: 2px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; border: 1px solid transparent; }
.heat .hc small { font-weight: 400; font-size: 10px; opacity: .8; }
.heat .hc.gap { border: 1px dashed var(--gap); color: var(--gap); font-weight: 400; }
.heat .hc.na { background: transparent; color: var(--ink-3); cursor: default; }
.heat th.step { font-weight: 500; color: var(--ink); max-width: 120px; white-space: normal; font-size: 11.5px; }
.heat th.phase { background: var(--accent-soft); font-size: 11px; text-align: center; }
.src-pii { font-size: 11px; }
.atom { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; background: var(--surface); }
.atom .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 4px; font-size: 11.5px; color: var(--ink-2); }
.atom .cls { font-weight: 700; text-transform: uppercase; letter-spacing: .05em; font-size: 10.5px; padding: 1px 6px; border-radius: 4px; }
.atom .cls.observed { background: var(--observed-soft); color: var(--observed); } .atom .cls.reported { background: var(--reported-soft); color: var(--reported); } .atom .cls.assumed { background: var(--assumed-soft); color: var(--assumed); }
.atom q { quotes: "«" "»"; font-style: italic; }
.atom .txt { font-size: 13px; }
.atom .loc { font-family: var(--mono); font-size: 11px; color: var(--ink-3); }
.atom .contra { margin-top: 4px; font-size: 12px; color: var(--breakdown); }

/* Chancen-Layer */
.matrix { position: relative; width: 100%; aspect-ratio: 1.3; max-height: 460px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); overflow: hidden; }
.matrix .q { position: absolute; width: 50%; height: 50%; padding: 8px 10px; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); }
.matrix .q.tl { left: 0; top: 0; width: 39.5%; border-right: 1px dashed var(--line-strong); border-bottom: 1px dashed var(--line-strong); }
.matrix .q.tr { right: 0; top: 0; width: 60.5%; border-bottom: 1px dashed var(--line-strong); text-align: right; }
.matrix .q.bl { left: 0; bottom: 0; width: 39.5%; border-right: 1px dashed var(--line-strong); display: flex; align-items: flex-end; }
.matrix .q.br { right: 0; bottom: 0; width: 60.5%; display: flex; align-items: flex-end; justify-content: flex-end; }
.matrix .ax { position: absolute; font-size: 11px; color: var(--ink-2); }
.matrix .ax.x { bottom: 4px; left: 50%; transform: translateX(-50%); } .matrix .ax.y { top: 50%; left: 50%; transform: translate(-50%, -50%); color: var(--ink-3); font-size: 10px; }
.matrix .opp { position: absolute; transform: translate(-50%, -50%); width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 2px solid var(--surface); box-shadow: var(--shadow); }
.matrix .opp:hover { transform: translate(-50%, -50%) scale(1.15); }
.opp-card { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; background: var(--surface); }
.opp-card .h { display: flex; gap: 8px; align-items: flex-start; }
.opp-card .num { flex: 0 0 auto; width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.opp-card .scores { display: flex; gap: 10px; font-size: 11.5px; color: var(--ink-2); margin: 6px 0; flex-wrap: wrap; }
.opp-card ul { margin: 6px 0 0; padding-left: 18px; font-size: 12.5px; }
.opp-card li.mvp::marker { content: "✓ "; color: var(--positive); }

/* Prüfung */
.finding { display: grid; grid-template-columns: 64px 1fr; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.finding:last-child { border-bottom: 0; }
.finding .lvl { font-size: 10.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 2px 6px; border-radius: 4px; text-align: center; align-self: start; }
.finding .lvl.ERROR { background: var(--breakdown-soft); color: var(--breakdown); } .finding .lvl.WARN { background: var(--friction-soft); color: var(--friction); } .finding .lvl.INFO { background: var(--surface-2); color: var(--ink-2); }
.finding .hint { color: var(--ink-2); font-size: 12.5px; margin-top: 2px; }
.finding .path { font-family: var(--mono); font-size: 11px; color: var(--ink-3); }

/* Drawer */
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(480px, 100%); background: var(--surface); border-left: 1px solid var(--line); box-shadow: var(--shadow); transform: translateX(105%); transition: transform .22s ease; z-index: 40; display: flex; flex-direction: column; }
.drawer.open { transform: none; }
.drawer .dh { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: flex-start; }
.drawer .dh h2 { font-size: 14px; flex: 1; }
.drawer .db { padding: 14px 16px; overflow: auto; }
.drawer .close { border: 0; background: var(--surface-2); border-radius: 6px; width: 30px; height: 30px; cursor: pointer; }
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.25); z-index: 30; display: none; }
.scrim.open { display: block; }
.claim-txt { font-size: 14px; margin-bottom: 10px; }
.verdict { font-size: 12.5px; padding: 8px 10px; border-radius: 8px; margin-bottom: 12px; }
.verdict.p { background: var(--positive-soft); } .verdict.a { background: var(--assumed-soft); } .verdict.n { background: var(--surface-2); color: var(--ink-2); }

etzung.", "linked_pain_points": ["pp-infoanlass-zeitpunkt"], "phase_ref": "vorbereitung", "user_impact": 3, "public_value": 2, "effort": 2, "owner": "Schulleitung", "status": "open", "stories": [{"text": "Als Elternteil möchte ich kurz nach dem Brief eine Gelegenheit haben, meine Fragen persönlich zu stellen, damit ich nicht bis Mai warte.", "mvp": true}, {"text": "Als fremdsprachiges Elternteil möchte ich am Anlass eine Übersetzung erhalten, die nicht vom Zufall abhängt.", "mvp": false}], "evidence_refs": ["e3-20", "e3-10"]}, {"id": "opp-schnupper-termine", "hmw": "Wie können wir Schnupperbesuche auch ausserhalb der üblichen Arbeitszeiten anbieten?", "description": "Alternative Termine am späten Nachmittag; geprüft und zurückgestellt, weil der Besuch den regulären Kindergartenbetrieb zeigen soll.", "linked_pain_points": ["pp-schnupper-arbeitszeit"], "phase_ref": "vorbereitung", "user_impact": 2, "public_value": 2, "effort": 3, "owner": "Schulleitung", "status": "wontfix", "stories": [{"text": "Als berufstätiges Elternteil möchte ich einen Schnuppertermin ausserhalb meiner Arbeitszeit wählen können.", "mvp": false}, {"text": "Als Elternteil möchte ich den Schnuppertermin früh kennen, damit ich rechtzeitig frei nehmen kann.", "mvp": true}], "evidence_refs": ["e2-18"]}], "sources": [{"id": "int-e1", "title": "Interview E1 – zugezogenes Elternteil", "kind": "interview", "default_class": "reported", "date": "2026-02", "n": 1, "participants": "Elternteil, im Herbst aus einem anderen Kanton zugezogen", "pii_status": "anonymised", "location": "input/interview-e1.md", "notes": "Synthetisches Transkript; Kind im Jahrgang mit Eintritt August 2025."}, {"id": "int-e2", "title": "Interview E2 – berufstätiges Elternpaar, zweites Kind", "kind": "interview", "default_class": "reported", "date": "2026-02", "n": 1, "participants": "Elternpaar, beide berufstätig, Betreuungsbedarf ab dem ersten Tag", "pii_status": "anonymised", "location": "input/interview-e2.md", "notes": "Synthetisch : "Mitarbeitende Kommunikation, Kreisschulbehörde, Betreuung – ohne Eltern", "pii_status": "none", "location": "input/workshop-notizen.md", "notes": "Team-Annahmen vor jeder Nutzerevidenz."}], "evidence": [{"id": "e1-01", "source_ref": "int-e1", "class": "reported", "kind": "quote", "text": "Wir sind im Oktober aus dem Aargau nach Zürich gezogen. Dort hätte man sich anmelden müssen, hier hiess es, das laufe automatisch.", "locator": "Zeile 7", "signal": "need", "phase_hint": "information", "persona_hint": "zugezogen", "tags": ["zuzug", "automatischer-eintritt"]}, {"id": "e1-02", "source_ref": "int-e1", "class": "reported", "kind": "quote", "text": "Nicht im Dezember. Ich habe gewartet und gewartet. Im Januar habe ich dann angefangen, nervös zu werden.", "locator": "Zeile 11", "signal": "friction", "phase_hint": "information", "channel_hint": "letter", "emotion_hint": {"valence": -1, "label": "nervös", "explicit": true}, "contradicts": ["doc-01"], "tags": ["brief-spaet"]}, {"id": "e1-03", "source_ref": "int-e1", "class": "reported", "kind": "quote", "text": "Da steht viel, aber ich wusste nicht, ob ich etwas tun muss oder nicht. Es stand nirgends: Wenn Sie zugezogen sind, dann machen Sie das.", "locator": "Zeile 13", "signal": "friction", "phase_hint": "information", "channel_hint": "web", "tags": ["website", "zuzug"]}, {"id": "e1-04", "source_ref": "int-e1", "class": "reported", "kind": "quote", "text": "Ich hatte das Gefühl, alle anderen wissen Bescheid und ich nicht.", "locator": "Zeile 14", "signal": "friction", "phase_hint": "information", "emotion_hint": {"valence": -1, "label": "Gefühl, alle anderen wissen Bescheid und ich nicht", "explicit": true}}, {"id": "e1-05", "source_ref": "int-e1", "class": "reported", "kind": "quote", "text": "Mitte Januar habe ich bei der Kreisschulbehörde angerufen. Die Frau am Telefon war sehr freundlich, sie hat mich sofort gefunden und gesagt, der Brief sei an die alte Adresse gegangen.", "locator": "Zeile 16", "signal": "workaround", "phase_hint": "information", "channel_hint": "phone", "contradicts": ["doc-01"], "tags": ["adressabgleich"]}, {"id": "e1-07", "source_ref": "int-e1", "class": "reported", "kind": "quote", "text": "Was mir fehlte, war eine Zeitachse. Es standen Daten drin, aber ich musste mir selber zusammensuchen, was wann passiert.", "locator": "Zeile 23", "signal": "need", "phase_hint": "information", "channel_hint": "letter", "tags": ["zeitachse"]}, {"id": "e1-08", "source_ref": "int-e1", "class": "reported", "kind": "quote", "text": "Wir hatten den Kindergarten um die Ecke erwartet, zugeteilt wurde einer, der zwölf Minuten zu Fuss entfernt ist, über eine grosse Strasse.", "locator": "Zeile 27", "signal": "friction", "phase_hint": "zuteilung", "tags": ["schulweg"]}, {"id": "e1-09", "source_ref": "int-e1", "class": "reported", "kind": "quote", "text": "Im Brief stand ein Satz zur Begründung, Kapazität und Schulweg, aber ich habe nicht verstanden, warum der nähere nicht ging.", "locator": "Zeile 28", "signal": "friction", "phase_hint": "zuteilung", "channel_hint": "letter", "contradicts": ["doc-03"], "tags": ["begruendung"]}, {"id": "e1-10", "source_ref": "int-e1", "class": "reported", "kind": "quote", "text": "Ich habe eine E-Mail geschrieben und nachgefragt. Die Antwort kam nach einer Woche und war korrekt, aber eben: Kapazität.", "locator": "Zeile 30", "signal": "workaround", "phase_hint": "zuteilung", "channel_hint": "email"}, {"id": "e1-11", "source_ref": "int-e1", "class": "reported", "kind": "quote", "text": "Ich habe es dann akzeptiert. Es bringt nichts, sich aufzureiben.", "locator": "Zeile 31", "signal": "neutral", "phase_hint": "zuteilung", "emotion_hint": {"valence": -1, "label": "resigniert (abgeleitet)", "explicit": false}}, {"id": "e1-12", "source_ref": "int-e1", "class": "reported", "kind": "quote", "text": "Das war der beste Moment im ganzen Ablauf. Man sah die Lehrpersonen, den Raum, die anderen Eltern.", "locator": "Zeile 35", "signal": "positive", "phase_hint": "vorbereitung", "channel_hint": "event", "emotion_hint": {"valence": 2, "label": "bester Moment im ganzen Ablauf", "explicit": true}}, {"id": "e1-14", "source_ref": "int-e1", "class": "reported", "kind": "quote", "text": "Der erste Tag war emotional. Man steht da mit dem Kind und weiss nicht, ob man bleiben oder gehen soll.", "locator": "Zeile 42", "signal": "friction", "phase_hint": "start", "emotion_hint": {"valence": 0, "label": "emotional, unsicher ob bleiben oder gehen", "explicit": true}}, {"id": "e1-17", "source_ref": "int-e1", "class": "reported", "kind": "quote", "text": "Eine Seite für Zugezogene: Sie sind neu hier, so läuft es, das müssen Sie tun, das passiert von selbst. Und eine Nummer, die man anrufen kann, prominent.", "locator": "Zeile 52", "signal": "need", "phase_hint": "information", "channel_hint": "web", "tags": ["zuzug"]}, {"id": "e1-20", "source_ref": "int-e1", "class": "reported", "kind": "quote", "text": "Anstrengend für die Kleine, sie war jeden Nachmittag müde. Für uns eigentlich gut, weil wir immer wussten, was läuft.", "locator": "Zeile 45", "signal": "positive", "phase_hint": "ankommen", "emotion_hint": {"valence": 1, "label": "eigentlich gut, weil wir immer wussten, was läuft", "explicit": true}}, {"id": "e2-03", "source_ref": "int-e2", "class": "reported", "kind": "quote", "text": "Eine Frist habe ich nicht gesehen, oder sie war nicht hervorgehoben.", "locator": "Zeile 11", "signal": "friction", "phase_hint": "information", "channel_hint": "letter", "contradicts": ["doc-04"], "tags": ["betreuung", "frist"]}, {"id": "e2-05", "source_ref": "int-e2", "class": "reported", "kind": "quote", "text": "Das PDF muss man ausdrucken, ausfüllen, unterschreiben und per Post schicken.", "locator": "Zeile 14", "signal": "friction", "phase_hint": "vorbereitung", "channel_hint": "paper_form", "tags": ["formular"]}, {"id": "e2-07", "source_ref": "int-e2", "class": "reported", "kind": "quote", "text": "Auf dem Formular stand ein Datum, auf der Website ein anderes. Ich habe dann angerufen, um sicherzugehen.", "locator": "Zeile 17", "signal": "breakdown", "phase_hint": "vorbereitung", "channel_hint": "phone", "tags": ["frist"]}, {"id": "e2-08", "source_ref": "int-e2", "class": "reported", "kind": "quote", "text": "Dass die Frist Ende Februar sei, aber dass Anmeldungen bis zum Zuteilungsentscheid noch berücksichtigt würden. Das hat mich beruhigt, aber auch irritiert. Welches Datum gilt denn jetzt?", "locator": "Zeile 19", "signal": "friction", "phase_hint": "vorbereitung", "channel_hint": "phone", "emotion_hint": {"valence": -1, "label": "beruhigt, aber auch irritiert", "explicit": true}, "tags": ["frist"]}, {"id": "e2-09", "source_ref": "int-e2", "class": "reported", "kind": "quote", "text": "Weil wir die Betreuung anmelden mussten, bevor wir wussten, welcher Kindergarten es wird. Man meldet sich also für einen Hort an, ohne zu wissen, ob er zum Kindergarten passt.", "locator": "Zeile 21", "signal": "friction", "phase_hint": "vorbereitung", "tags": ["betreuung", "reihenfolge"]}, {"id": "e2-11", "source_ref": "int-e2", "class": "reported", "kind": "quote", "text": "Zur Betreuung stand aber nichts drin. Kein Wort.", "locator": "Zeile 26", "signal": "friction", "phase_hint": "zuteilung", "channel_hint": "letter", "tags": ["betreuung"]}, {"id": "e2-18", "source_ref": "int-e2", "class": "reported", "kind": "quote", "text": "Vormittags, an einem Dienstag. Ich musste frei nehmen. Beim ersten Kind war das auch so.", "locator": "Zeile 41", "signal": "friction", "phase_hint": "vorbereitung", "channel_hint": "in_person"}, {"id": "e2-20", "source_ref": "int-e2", "class": "reported", "kind": "quote", "text": "Für Eltern, die das nicht wissen, ist das ein Schock: Das Kind ist zwei Wochen lang nur halbe Tage da und die Betreuung deckt das nicht automatisch ab.", "locator": "Zeile 44", "signal": "breakdown", "phase_hint": "start", "contradicts": ["doc-07"], "tags": ["eingewoehnung", "betreuung"]}, {"id": "e2-21", "source_ref": "int-e2", "class": "reported", "kind": "quote", "text": "Bei uns ja, weil wir nachgefragt haben. Eine Mutter aus der Klasse hat es nicht gewusst und musste zwei Wochen improvisieren.", "locator": "Zeile 46", "signal": "breakdown", "phase_hint": "start", "tags": ["eingewoehnung", "betreuung"]}, {"id": "e2-24", "source_ref": "int-e2", "class": "reported", "kind": "quote", "text": "Die Betreuung gehört in denselben Brief und in denselben Entscheid wie der Kindergarten. Ein Datum, eine Frist, eine Antwort.", "locator": "Zeile 52", "signal": "need", "tags": ["betreuung", "reihenfolge"]}, {"id": "e2-26", "source_ref": "int-e2", "class": "reported", "kind": "quote", "text": "Die Leute. Jede einzelne Person am Telefon war hilfsbereit. Das System ist das Problem, nicht die Menschen.", "locator": "Zeile 55", "signal": "neutral"}, {"id": "e3-01", "source_ref": "int-e3", "class": "reported", "kind": "quote", "text": "Ein grosses Couvert mit dem Stadtlogo. Ich habe gesehen, es ist offiziell, und ich habe Angst bekommen.", "locator": "Zeile 7", "signal": "friction", "phase_hint": "information", "channel_hint": "letter", "emotion_hint": {"valence": -2, "label": "Angst bekommen", "explicit": true}, "contradicts": ["ws-02"], "persona_hint": "fremdsprachig"}, {"id": "e3-03", "source_ref": "int-e3", "class": "reported", "kind": "quote", "text": "Die Hälfte. Die Wörter sind schwierig. Kreisschulbehörde, Zuteilungsentscheid, Stichtag. Ich habe mit dem Handy übersetzt, aber die Übersetzung war komisch.", "locator": "Zeile 11", "signal": "friction", "phase_hint": "information", "tags": ["sprache"]}, {"id": "e3-04", "source_ref": "int-e3", "class": "reported", "kind": "quote", "text": "Dann habe ich die Nachbarin gefragt. Sie hat Kinder in der Schule und hat mir alles erklärt. Ohne sie hätte ich den Brief weggelegt.", "locator": "Zeile 12", "signal": "workaround", "phase_hint": "information", "tags": ["netzwerk"]}, {"id": "e3-05", "source_ref": "int-e3", "class": "reported", "kind": "quote", "text": "Ja, aber alles auf Deutsch. Sehr viel Text. Ich habe nach meiner Sprache gesucht, aber nichts gefunden. Nur ein PDF mit Informationen in mehreren Sprachen, aber das war von einem anderen Jahr.", "locator": "Zeile 16", "signal": "friction", "phase_hint": "information", "channel_hint": "web", "contradicts": ["doc-05"], "tags": ["sprache", "website"]}, {"id": "e3-09", "source_ref": "int-e3", "class": "reported", "kind": "quote", "text": "Die Person war geduldig. Sie hat gesagt, für mich ist nichts zu tun. Das war eine grosse Erleichterung.", "locator": "Zeile 26", "signal": "positive", "phase_hint": "information", "channel_hint": "counter", "emotion_hint": {"valence": 1, "label": "grosse Erleichterung", "explicit": true}}, {"id": "e3-10", "source_ref": "int-e3", "class": "reported", "kind": "quote", "text": "Das war das Beste. Ich habe die Lehrerin gesehen, sie hat langsam gesprochen und Bilder gezeigt. Und es gab eine Frau, die für drei Familien übersetzt hat.", "locator": "Zeile 28", "signal": "positive", "phase_hint": "vorbereitung", "channel_hint": "event", "emotion_hint": {"valence": 2, "label": "das Beste", "explicit": true}}, {"id": "e3-12", "source_ref": "int-e3", "class": "reported", "kind": "quote", "text": "Mein Sohn hat gespielt, ich habe geschaut. Es war schön. Aber ich habe nicht gewusst, ob ich bleiben soll oder gehen, niemand hat es gesagt.", "locator": "Zeile 34", "signal": "friction", "phase_hint": "vorbereitung", "channel_hint": "in_person", "emotion_hint": {"valence": 1, "label": "schön", "explicit": true}}, {"id": "e3-15", "source_ref": "int-e3", "class": "reported", "kind": "quote", "text": "Ja, im Oktober. Die Lehrerin hat gefragt, ob ich eine Übersetzung möchte. Das hat mich sehr gefreut, dass sie gefragt hat.", "locator": "Zeile 41", "signal": "positive", "phase_hint": "ankommen", "emotion_hint": {"valence": 2, "label": "sehr gefreut", "explicit": true}}, {"id": "e3-16", "source_ref": "int-e3", "class": "reported", "kind": "quote", "text": "Der erste Brief. Ich habe ihn eine Woche auf dem Tisch liegen lassen, weil ich nicht wusste, was ich tun soll.", "locator": "Zeile 44", "signal": "breakdown", "phase_hint": "information", "channel_hint": "letter", "tags": ["nichthandeln"]}, {"id": "e3-18", "source_ref": "int-e3", "class": "reported", "kind": "quote", "text": "Ein Satz oben im Brief in meiner Sprache: Sie müssen nichts tun, Ihr Kind ist angemeldet. Dann hätte ich ruhig geschlafen.", "locator": "Zeile 47", "signal": "need", "phase_hint": "information", "tags": ["sprache"]}, {"id": "e3-20", "source_ref": "int-e3", "class": "reported", "kind": "quote", "text": "Der Infoabend sollte früher sein. Im Dezember, wenn der Brief kommt. Dann hätte ich die Fragen gleich stellen können.", "locator": "Zeile 54", "signal": "need", "phase_hint": "vorbereitung", "channel_hint": "event"}, {"id": "anf-01", "source_ref": "anfragen", "class": "observed", "kind": "metric", "text": "17 von 30 Anfragen (57 %) gingen per Telefon ein, 9 per E-Mail, 4 am Schalter.", "locator": "Spalte kanal, alle 30 Zeilen", "value": 57, "unit": "% der Anfragen", "signal": "workaround", "contradicts": ["ws-08"]}, {"id": "anf-03", "source_ref": "anfragen", "class": "observed", "kind": "observation", "text": "Formular Betreuung nennt 28. Februar, Website nennt 31. März – welche Frist gilt?", "locator": "anfrage_id A-008", "signal": "friction", "phase_hint": "vorbereitung", "channel_hint": "email"}, {"id": "anf-04", "source_ref": "anfragen", "class": "observed", "kind": "observation", "text": "Zugezogen aus anderem Kanton, wartet seit Dezember auf Brief.", "locator": "anfrage_id A-007", "signal": "breakdown", "phase_hint": "information", "channel_hint": "phone", "contradicts": ["doc-01"]}, {"id": "anf-05", "source_ref": "anfragen", "class": "observed", "kind": "metric", "text": "7 von 30 Anfragen betreffen die Zuteilung (Wunschkindergarten, Begründung, Einsprache), alle zwischen 10. April und 3. Juni.", "locator": "kategorie = zuteilung hase_ref": "start", "user_impact": 4, "public_value": 3, "effort": 2, "owner": "Betreuung (Hort)", "status": "open", "stories": [{"text": "Als Elternteil mit Hortplatz möchte ich, dass die halben Eingewöhnungstage automatisch abgedeckt sind, damit ich nicht improvisieren muss.", "mvp": true}, {"text": "Als Elternteil möchte ich den Eingewöhnungsplan mit der Hortbestätigung erhalten, nicht erst am ersten Tag.", "mvp": false}], "evidence_refs": ["e2-20", "e2-21"]}], "sources": [{"id": "int-e2", "title": "Interview E2 – berufstätiges Elternpaar, zweites Kind", "kind": "interview", "default_class": "reported", "date": "2026-02", "n": 1, "participants": "Elternpaar, beide berufstätig, Betreuungsbedarf ab dem ersten Tag", "pii_status": "anonymised", "location": "input/interview-e2.md", "notes": "Synthetisches Transkript."}, {"id": "anfragen", "title": "Anfragen an die Kreisschulbehörde (anonymisierter Export)", "kind": "inquiry_log", "default_class": "observed", "date": "2024-12 bis 2025-11", "n": 30, "participants": "Eltern, die telefonisch, per E-Mail oder am Schalter nachgefragt haben", "pii_status": "anonymised", "location": "input/anfragen-export.csv", "notes": "Synthetische Stichprobe von 30 Anfragen über einen Jahreszyklus; Kurztexte ohne Namen und Adressen."}, {"id": "befragung", "title": "Elternbefragung Kindergarteneintritt (aggregiert)", "kind": "survey", "default_class": "reported", "date": "2025-10", "n": 412, "participants": "Eltern der Kinder mit Eintritt August 2025", "pii_status": "anonymised", "location": "input/elternbefragung.csv", "notes": "Synthetische Aggregatwerte; nur Zustimmungsanteile, keine Einzelantworten."}, {"id": "analytics", "title": "Webanalytics Bereich Kindergarten", "kind": "analytics", "default_class": "observed", "date": "2024-12 bis 2025-06", "pii_status": "none", "location": "input/webanalytics.csv", "notes": "Synthetische Seitenstatistik, ohne Personenbezug."}, {"id": "prozessdok", "title": "Prozessbeschrieb Einschulung (intern, S eldungen bis zum Zuteilungsentscheid noch berücksichtigt würden. Das hat mich beruhigt, aber auch irritiert. Welches Datum gilt denn jetzt?", "locator": "Zeile 19", "signal": "friction", "phase_hint": "vorbereitung", "channel_hint": "phone", "emotion_hint": {"valence": -1, "label": "beruhigt, aber auch irritiert", "explicit": true}, "tags": ["frist"]}, {"id": "e2-10", "source_ref": "int-e2", "class": "reported", "kind": "quote", "text": "Das ist, als würde man einen Parkplatz mieten, bevor man weiss, wo man wohnt.", "locator": "Zeile 22", "signal": "friction", "phase_hint": "vorbereitung", "tags": ["reihenfolge"]}, {"id": "e2-11", "source_ref": "int-e2", "class": "reported", "kind": "quote", "text": "Zur Betreuung stand aber nichts drin. Kein Wort.", "locator": "Zeile 26", "signal": "friction", "phase_hint": "zuteilung", "channel_hint": "letter", "tags": ["betreuung"]}, {"id": "e2-12", "source_ref": "int-e2", "class": "reported", "kind": "quote", "text": "Juni. Wir mussten bis Juni warten, um zu wissen, ob unser Kind ab August betreut ist. Mein Arbeitgeber wollte im Mai meine Pensen für das zweite Halbjahr wissen.", "locator": "Zeile 29", "signal": "friction", "phase_hint": "zuteilung", "tags": ["betreuung", "planungssicherheit"]}, {"id": "e2-13", "source_ref": "int-e2", "class": "reported", "kind": "quote", "text": "Das war der Moment, wo ich wirklich wütend wurde. Nicht auf die Person am Telefon, auf das System.", "locator": "Zeile 30", "signal": "breakdown", "phase_hint": "zuteilung", "emotion_hint": {"valence": -2, "label": "wütend auf das System", "explicit": true}}, {"id": "e2-15", "source_ref": "int-e2", "class": "reported", "kind": "quote", "text": "Mitte Juni, per Brief. Platz im Hort beim Kindergarten, alles gut. Die Tagesfamilie haben wir wieder abgesagt.", "locator": "Zeile 34", "signal": "positive", "phase_hint": "vorbereitung", "channel_hint": "letter", "emotion_hint": {"valence": 1, "label": "alles gut", "explicit": true}}, {"id": "e2-17", "source_ref class Idx {

    j.phases.forEach((p, pi) => p.steps.forEach((s, si) => {
      this.steps.push({ step: s, phase: p, pi, si, gi: this.steps.length });

  classes(refs) { const out = { observed: 0, reported: 0, assumed: 0, missing: 0 }; (refs || []).forEach(r => { const a = this.ev.get(r); if (a) out[a.class]++; else out.missing++; }); return out; }

  oppsForPhase(phaseId) { return this.opps.filter(o => { if (o.phase_ref) return o.phase_ref === phaseId; const st = this.ppStep.get((o.linked_pain_points || [])[0]); const e = this.steps.find(x => x.step.id === st); return e && e.phase.id === phaseId; }); }
  claims() { // für Heatmap und Quoten
    const out = [];
    this.steps.forEach(e => { const s = e.step; out.push({ kind: "step", refs: s.evidence_refs || [], e });
      (s.thinking || []).forEach(t => out.push({ kind: "thinking", refs: t.evidence_refs || [], e }));
      if (s.feeling) out.push({ kind: "feeling", refs: s.feeling.evidence_refs || [], e });
      (s.pain_points || []).forEach(p => out.push({ kind: "pain_point", refs: p.evidence_refs || [], e }));
      (s.edge_cases || []).forEach(p => out.push({ kind: "edge_case", refs: p.evidence_refs || [], e }));

  h += '</div>';
  const oq = idx.j.open_questions || [];
  h += '<div class="grid-2"><div class="panel"><h2>Offene Fragen (' + oq.length + ')</h2>' + (oq.length ? '<ul style="margin:0;padding-left:18px">' + oq.map(q => '<li>' + esc(q.text) + (q.proposed_method ? ' <span class="badge">' + esc(q.proposed_method) + '</span>' : '') + '</li>').join("") + '</ul>' : '<p class="muted">Keine.</p>') + '</div>';
  const chl = idx.j.changelog || [];
  h += '<div class="panel"><h2>Versionen</h2>' + (chl.length ? '<table>' + chl.map(c => '<tr><th>v' + esc(c.version) + '</th><td>' + esc(c.date) + '</td><td>' + esc(c.summary) + '</td></tr>').join("") + '</table>' : '<p class="muted">Kein Changelog.</p>') + '</div></div>';
  return h;
}

// ---------------------------------------------------------------- Drawer
function openDrawer(title, text, refs) {
  const idx = IDX, atoms = (refs || "").split(",").filter(Boolean).map(r => idx.ev.get(r) || { id: r, missing: true });
  $("#dTitle").textContent = title || "Evidenz";
  const c = idx.classes(atoms.filter(a => !a.missing).map(a => a.id));
  let v;
  if (!atoms.length) v = '<div class="verdict n">Keine Evidenz hinterlegt – diese Aussage ist eine Annahme.</div>';
  else if (c.observed + c.reported > 0) v = '<div class="verdict p">Gestützt durch ' + (c.observed ? c.observed + ' beobachtete' : '') + (c.observed && c.reported ? ' und ' : '') + (c.reported ? c.reported + ' berichtete' : '') + ' Evidenz' + (c.assumed ? ' sowie ' + c.assumed + ' Annahme(n)' : '') + '.</div>';
  else v = '<div class="verdict a">Nur Annahmen (' + c.assumed + ') – aus Innensicht, nicht von Nutzenden.</div>';
  $("#dBody").innerHTML = '<div class="claim-txt">' + esc(text) + '</div>' + v + atoms.map(a => a.missing ? '<div class="atom c-breakdown">Unbekannte Referenz «' + esc(a.id) + '»</div>' : atomHtml(idx, a)).join("");
  $("#drawer").classList.add("open"); $("#scrim").classList.add("open");
}
function closeDrawer() { $("#drawer").classList.remove("open"); $("#scrim").classList.remove("open"); }

// ---------------------------------------------------------------- Render
function render() {
  IDX = new Idx(journeys[state.j]); renderHeader();
  const m = $("#main");
  m.innerHTML = '<section class="layer' + (state.tab === "journey" ? " active" : "") + '" data-l="journey">' + renderJourney(IDX) + '</section>'
    + '<section class="layer' + (state.tab === "process" ? " active" : "") + '" data-l="process">' + renderProcess(IDX) + '</section>'
    + '<section class="layer' + (state.tab === "evidence" ? " active" : "") + '" data-l="evidence">' + renderEvidence(IDX) + '</section>'
    + '<section class="layer' + (state.tab === "opps" ? " active" : "") + '" data-l="opps">' + renderOpps(IDX) + '</section>'
    + '<section class="layer' + (state.tab === "audit" ? " active" : "") + '" data-l="audit">' + renderAudit(IDX) + '</section>';
  const meta = journeys[state.j].meta;
  $("#footer").textContent = (meta.context?.organisation ? meta.context.organisation + " · " : "") + (meta.context?.service || "") + (meta.updated ? " · Stand " + meta.updated : "") + " · " + DATA.generator;
  requestAnimationFrame(() => drawCurve(IDX));
}
function showTab(t) { state.tab = t; document.querySelectorAll("section.layer").forEach(s => s.classList.toggle("active", s.dataset.l === t)); document.querySelectorAll("nav.tabs button").forEach(b => b.classList.toggle("active", b.dataset.tab === t)); if (t === "journey") requestAnimationFrame(() => drawCurve(IDX)); }

document.addEventListener("click", ev => {
  const tab = ev.target.closest("nav.tabs button"); if (tab) return showTab(tab.dataset.tab);
  const cl = ev.target.closest("[data-refs]"); if (cl) return openDrawer(cl.dataset.title, cl.dataset.text, cl.dataset.refs);
  const op = ev.target.closest(".matrix .opp"); if (op) { const card = $("#opp-" + op.dataset.opp); card?.scrollIntoView({ behavior: "smooth", block: "center" }); card.style.borderColor = "var(--accent)"; setTimeout(() => card.style.borderColor = "", 1500); return; }
  if (ev.target.closest("#dClose") || ev.target.closest("#scrim")) closeDrawer();
});
document.addEventListener("keydown", ev => { if (ev.key === "Escape") closeDrawer(); });
$("#primOnly").addEventListener("change", ev => { state.primOnly = ev.target.checked; render(); });
$("#personaSel").addEventListener("change", ev => { state.j = +ev.target.value; render(); });
$("#themeBtn").addEventListener("click", () => { const r = document.documentElement, cur = r.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); r.dataset.theme = cur === "dark" ? "light" : "dark"; });
window.addEventListener("resize", () => drawCurve(IDX));

if (!DATA || !DATA.journeys?.length) { $("#main").innerHTML = '<div class="panel"><h2>Keine Daten</h2><p>Diese Datei wurde ohne Journey erzeugt. <code>journeykit render journey.json</code> injiziert die Daten.</p></div>'; }
else render();
</script>
</body>
</html>
