<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JourneyKit Viewer</title>
<meta name="description" content="Interaktive, evidenzbasierte User Journey: Journey-Layer, Prozess- und Fehlerpfade, Evidenz-Heatmap, Chancenmatrix und methodische Prüfung.">
<style>
:root {
  --bg: #f6f5f1; --surface: #ffffff; --surface-2: #efede7; --line: #d9d6cd; --line-strong: #b9b5a9;
  --ink: #1d1c1a; --ink-2: #5a5853; --ink-3: #8a877f;
  --accent: #2f4f7f; --accent-ink: #ffffff; --accent-soft: #e3eaf4;
  --observed: #1f7a8c; --observed-soft: #d9eef2; --reported: #6a4c93; --reported-soft: #e9e2f3; --assumed: #a07a2a; --assumed-soft: #f3ead6;
  --friction: #c47f17; --friction-soft: #fbead0; --breakdown: #b3261e; --breakdown-soft: #f8dcd9; --positive: #2e7d4f; --positive-soft: #d8eee0;
  --gap: #9c9a93; --shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.08);
  --radius: 10px; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --sans: "Inter", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15161a; --surface: #1e2026; --surface-2: #272a31; --line: #343842; --line-strong: #4a4f5b;
    --ink: #ebebe6; --ink-2: #b4b4ad; --ink-3: #85857f;
    --accent: #8fb0e0; --accent-ink: #0f1320; --accent-soft: #233044;
    --observed: #5fc3d6; --observed-soft: #173a42; --reported: #b79be0; --reported-soft: #33284a; --assumed: #e0b25a; --assumed-soft: #3f3418;
    --friction: #e5a24a; --friction-soft: #43301a; --breakdown: #ef7b73; --breakdown-soft: #4a1f1c; --positive: #6fcf93; --positive-soft: #1d3a29;
    --gap: #6e6e68; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"] {
  --bg: #15161a; --surface: #1e2026; --surface-2: #272a31; --line: #343842; --line-strong: #4a4f5b;
  --ink: #ebebe6; --ink-2: #b4b4ad; --ink-3: #85857f;
  --accent: #8fb0e0; --accent-ink: #0f1320; --accent-soft: #233044;
  --observed: #5fc3d6; --observed-soft: #173a42; --reported: #b79be0; --reported-soft: #33284a; --assumed: #e0b25a; --assumed-soft: #3f3418;
  --friction: #e5a24a; --friction-soft: #43301a; --breakdown: #ef7b73; --breakdown-soft: #4a1f1c; --positive: #6fcf93; --positive-soft: #1d3a29;
  --gap: #6e6e68; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.5);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0; font-weight: 600; letter-spacing: -0.01em; }
small, .muted { color: var(--ink-2); }
.mono { font-family: var(--mono); font-size: 12px; }

/* Kopf */
header.top { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-inner { padding: 12px 16px 0; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: flex-start; }
.title-block { flex: 1 1 320px; min-width: 0; }
.title-block h1 { font-size: 20px; line-height: 1.2; }
.title-block .sub { margin-top: 4px; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; color: var(--ink-2); }
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); font-size: 12px; white-space: nowrap; }
.badge.status-validated { border-color: var(--positive); color: var(--positive); background: var(--positive-soft); }
.badge.status-hypothesis, .badge.status-draft { border-color: var(--assumed); color: var(--assumed); background: var(--assumed-soft); }
.badge.synthetic { border-style: dashed; }
.badge.to-be { border-color: var(--assumed); color: var(--assumed); border-style: dashed; }
.badge.wrap { white-space: normal; max-width: 100%; border-radius: 10px; }
.badge.err { background: var(--breakdown-soft); color: var(--breakdown); border-color: var(--breakdown); }
.badge.warn { background: var(--friction-soft); color: var(--friction); border-color: var(--friction); }
.badge.ok { background: var(--positive-soft); color: var(--positive); border-color: var(--positive); }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; min-width: 0; max-width: 100%; }
.toggle { display: inline-flex; align-items: center; gap: 8px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer; user-select: none; }
.toggle input { accent-color: var(--accent); margin: 0; }
.toggle.active { border-color: var(--accent); background: var(--accent-soft); }
.btn { padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer; }
.btn:hover { border-color: var(--line-strong); }
select.persona { max-width: 100%; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit; }
nav.tabs { display: flex; gap: 2px; padding: 8px 16px 0; overflow-x: auto; scrollbar-width: none; }
nav.tabs::-webkit-scrollbar { display: none; }
nav.tabs button { border: 0; background: transparent; padding: 8px 12px 10px; border-bottom: 2px solid transparent; color: var(--ink-2); white-space: nowrap; cursor: pointer; border-radius: 6px 6px 0 0; }
nav.tabs button:hover { color: var(--ink); background: var(--surface-2); }
nav.tabs button.active { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
nav.tabs button .n { margin-left: 6px; font-size: 11px; color: var(--ink-3); }
.evbar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; width: 160px; background: var(--surface-2); }
.evbar span { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--ink-2); align-items: center; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; border: 2px solid currentColor; vertical-align: -1px; }
.dot.fill { background: currentColor; }
.c-observed { color: var(--observed); } .c-reported { color: var(--reported); } .c-assumed { color: var(--assumed); } .c-gap { color: var(--gap); }

/* Layouts */
main { padding: 16px; max-width: 100%; }
section.layer { display: none; }
section.layer.active { display: block; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.panel + .panel { margin-top: 14px; }
.panel h2 { font-size: 15px; margin-bottom: 8px; }
.panel h3 { font-size: 13px; color: var(--ink-2); text-transform: uppercase; letter-spacing: .04em; margin: 14px 0 6px; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.tile { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; }
.tile .v { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
.tile .l { font-size: 12px; color: var(--ink-2); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--ink-2); font-weight: 600; font-size: 12px; }

/* Journey-Raster */
.map-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.map { display: grid; min-width: max-content; }
.map > div { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding: 10px 12px; min-width: 0; }
.map .rowlabel { position: sticky; left: 0; z-index: 3; background: var(--surface-2); font-size: 12px; font-weight: 600; color: var(--ink-2); text-transform: uppercase; letter-spacing: .04em; }
.map .rowlabel small { display: block; text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--ink-3); margin-top: 2px; }
.map .phase { background: var(--accent-soft); border-right: 2px solid var(--accent); }
.map .phase h3 { font-size: 14px; color: var(--ink); text-transform: none; letter-spacing: 0; margin: 0; }
.map .phase .intent { font-size: 12px; color: var(--ink-2); margin-top: 3px; }
.map .phase .dur { font-size: 11px; color: var(--ink-3); margin-top: 2px; }
.map .phase-end { border-right: 2px solid var(--accent); }
.dbar { position: relative; height: 14px; margin: 2px 0 6px; }
.dbar .typ { position: absolute; left: 0; top: 2px; height: 10px; border-radius: 2px; background: var(--accent); min-width: 2px; }
.dbar .rng { position: absolute; top: 6px; height: 2px; background: var(--ink-3); }
.dbar .rng::before, .dbar .rng::after { content: ""; position: absolute; top: -4px; width: 2px; height: 10px; background: var(--ink-3); }
.dbar .rng::before { left: 0; } .dbar .rng::after { right: 0; }
.dbasis { font-size: 11.5px; color: var(--ink-3); }
.cost + .cost { margin-top: 8px; }
.cost .clabel { font-size: 12px; font-weight: 600; color: var(--ink-2); margin-bottom: 2px; }
.step h4 { font-size: 13.5px; margin-bottom: 4px; }
.step .action { color: var(--ink-2); font-size: 13px; }
.step .meta { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px; border-radius: 6px; font-size: 11.5px; background: var(--surface-2); color: var(--ink-2); border: 1px solid transparent; }
.chip.transition { border-color: var(--friction); color: var(--friction); background: var(--friction-soft); }
.chip.actor { border-color: var(--line); border-style: dashed; }
.claim { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 8px 6px 10px; margin: 0 0 6px; cursor: pointer; position: relative; font-size: 13px; line-height: 1.35; }
.claim:hover { border-color: var(--accent); }
.claim::before { content: ""; position: absolute; left: 0; top: 6px; bottom: 6px; width: 3px; border-radius: 2px; background: var(--line-strong); }
.claim.ev-primary::before { background: linear-gradient(var(--observed), var(--reported)); }
.claim.ev-assumed { border-style: dashed; }
.claim.ev-assumed::before { background: var(--assumed); }
.claim.ev-none { border-style: dashed; color: var(--ink-2); }
.claim.ev-none::before { background: transparent; border-left: 3px dotted var(--gap); }
.claim .evc { display: inline-flex; gap: 3px; margin-left: 6px; vertical-align: middle; }
.claim .evc i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; }
.claim .evc i.o { background: var(--observed); } .claim .evc i.r { background: var(--reported); } .claim .evc i.a { background: var(--assumed); }
.claim.pp { padding-left: 12px; }
.claim.pp.friction::before { background: var(--friction); } .claim.pp.breakdown::before { background: var(--breakdown); }
.claim.pp .pp-head { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 3px; }
.tag { font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; font-weight: 700; padding: 1px 6px; border-radius: 4px; }
.tag.friction { background: var(--friction-soft); color: var(--friction); } .tag.breakdown { background: var(--breakdown-soft); color: var(--breakdown); }
.tag.status { background: var(--surface-2); color: var(--ink-2); font-weight: 600; text-transform: none; letter-spacing: 0; }
.sev { display: inline-flex; gap: 2px; }
.sev i { width: 6px; height: 6px; border-radius: 1px; background: var(--line-strong); display: inline-block; }
.sev i.on { background: var(--ink-2); }
.pp .wa { color: var(--ink-2); font-size: 12px; margin-top: 3px; }
.pp-cause { color: var(--ink-2); font-size: 12px; margin: -2px 0 8px 2px; }
.branch > .pp-cause { margin: 4px 0 0; } .branch > .wa { color: var(--ink-2); font-size: 12px; margin-top: 2px; }
.hidden-note { font-size: 11.5px; color: var(--ink-3); font-style: italic; padding: 4px 0; }
.empty { color: var(--ink-3); font-size: 12px; }
.kpi { font-size: 12.5px; padding: 4px 0; border-bottom: 1px dashed var(--line); }
.kpi:last-child { border-bottom: 0; }
.kpi b { font-weight: 600; }
.kpi .k { color: var(--ink-3); font-size: 11px; }

/* Gefühlskurve */
.curve { position: relative; height: 150px; padding: 0 !important; }
.curve svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.curve .zero { position: absolute; left: 0; right: 0; top: 50%; border-top: 1px dashed var(--line-strong); }
.curve .nodata { position: absolute; bottom: 3px; padding: 0 8px; font-size: 10.5px; line-height: 1.3; color: var(--ink-3); font-style: italic; text-align: center; pointer-events: none; }
.curve .dropped { position: absolute; top: 3px; right: 8px; max-width: 60%; font-size: 10.5px; color: var(--ink-3); font-style: italic; text-align: right; }
.curve .pt { position: absolute; width: 14px; height: 14px; border-radius: 50%; transform: translate(-50%, -50%); border: 2.5px solid var(--ink); background: var(--ink); cursor: pointer; z-index: 2; }
.curve .pt.hollow { background: var(--surface); border-style: solid; }
.curve .pt.assumed { border-color: var(--assumed); background: var(--surface); border-style: dashed; }
.curve .pt.gap { width: 18px; height: 18px; border: 2px dotted var(--gap); background: transparent; color: var(--gap); font-size: 11px; display: flex; align-items: center; justify-content: center; }
.curve .pt.other { width: 9px; height: 9px; border-width: 2px; opacity: .85; z-index: 1; }
.curve .lbl { position: absolute; transform: translateX(-50%); font-size: 11px; color: var(--ink-2); max-width: 180px; text-align: center; line-height: 1.25; pointer-events: none; background: color-mix(in srgb, var(--surface) 85%, transparent); padding: 1px 4px; border-radius: 4px; }
.curve .scale { position: absolute; left: 4px; font-size: 10px; color: var(--ink-3); }

/* Prozess-Layer */
.flow { display: flex; flex-direction: column; gap: 0; }
.flow .phase-h { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-2); margin: 18px 0 8px; display: flex; align-items: center; gap: 10px; }
.flow .phase-h::after { content: ""; flex: 1; border-top: 1px solid var(--line); }
.node-row { display: grid; grid-template-columns: minmax(240px, 1.1fr) minmax(0, 2fr); gap: 14px; align-items: start; position: relative; padding-left: 22px; }
.node-row::before { content: ""; position: absolute; left: 7px; top: 0; bottom: 0; border-left: 2px solid var(--line-strong); }
.node-row:last-child::before { bottom: 50%; }
.node { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; position: relative; }
.node::before { content: ""; position: absolute; left: -19px; top: 16px; width: 10px; height: 10px; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent); }
.node.has-breakdown { border-color: var(--breakdown); }
.node.has-breakdown::before { border-color: var(--breakdown); background: var(--breakdown); }
.node h4 { font-size: 13.5px; }
.node .act { color: var(--ink-2); font-size: 12.5px; margin-top: 2px; }
.branches { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
.branch { border-radius: 10px; padding: 8px 10px 8px 12px; border: 1px solid var(--line); position: relative; font-size: 12.5px; background: var(--surface); }
.branch.bd { border-color: var(--breakdown); background: var(--breakdown-soft); }
.branch.fr { border-color: var(--friction); background: var(--friction-soft); }
.branch.ec { border-left: 3px solid var(--assumed); }
.branch .arrow { display: flex; gap: 8px; align-items: flex-start; margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--line-strong); }
.branch .arrow .lab { font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; font-weight: 700; white-space: nowrap; padding-top: 1px; }
.branch .arrow.rec .lab { color: var(--positive); }
.branch .arrow.rec.soll { opacity: .85; } .branch .arrow.rec.soll .lab { color: var(--assumed); }
.branch .arrow.wa .lab { color: var(--breakdown); }

/* Evidenz-Layer */
.heat, .scroll-x { overflow-x: auto; }
.panel-h { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.panel-h h2 { margin: 0 !important; }
.dl { display: flex; flex-wrap: wrap; gap: 6px; }
.heat table { min-width: max-content; }
.heat td.cell { text-align: center; padding: 0; }
.heat .hc { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 64px; height: 44px; margin: 2px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; border: 1px solid transparent; }
.heat .hc small { font-weight: 400; font-size: 10px; opacity: .8; }
.heat .hc.gap { border: 1px dashed var(--gap); color: var(--gap); font-weight: 400; }
.heat .hc.na { background: transparent; color: var(--ink-3); cursor: default; }
.heat th.step { font-weight: 500; color: var(--ink); max-width: 120px; white-space: normal; font-size: 11.5px; }
.heat th.phase { background: var(--accent-soft); font-size: 11px; text-align: center; }
.src-pii { font-size: 11px; }
.atom { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; background: var(--surface); }
.atom .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 4px; font-size: 11.5px; color: var(--ink-2); }
.atom .cls, .ov-link .cls { font-weight: 700; text-transform: uppercase; letter-spacing: .05em; font-size: 10.5px; padding: 1px 6px; border-radius: 4px; }
.atom .cls.observed, .ov-link .cls.observed { background: var(--observed-soft); color: var(--observed); } .atom .cls.reported, .ov-link .cls.reported { background: var(--reported-soft); color: var(--reported); } .atom .cls.assumed, .ov-link .cls.assumed { background: var(--assumed-soft); color: var(--assumed); }
.atom q { quotes: "«" "»"; font-style: italic; }
.atom .txt { font-size: 13px; }
.atom .loc { font-family: var(--mono); font-size: 11px; color: var(--ink-3); }
.atom .contra { margin-top: 4px; font-size: 12px; color: var(--breakdown); }

/* Chancen-Layer */
.matrix { position: relative; width: 100%; aspect-ratio: 1.3; max-height: 460px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); overflow: hidden; }
.matrix .q { position: absolute; width: 50%; height: 50%; padding: 8px 10px; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); }
.matrix .q.tl { left: 0; top: 0; width: 39.5%; border-right: 1px dashed var(--line-strong); border-bottom: 1px dashed var(--line-strong); }
.matrix .q.tr { right: 0; top: 0; width: 60.5%; border-bottom: 1px dashed var(--line-strong); text-align: right; }
.matrix .q.bl { left: 0; bottom: 0; width: 39.5%; border-right: 1px dashed var(--line-strong); display: flex; align-items: flex-end; }
.matrix .q.br { right: 0; bottom: 0; width: 60.5%; display: flex; align-items: flex-end; justify-content: flex-end; }
.matrix .ax { position: absolute; font-size: 11px; color: var(--ink-2); }
.matrix .ax.x { bottom: 4px; left: 50%; transform: translateX(-50%); } .matrix .ax.y { top: 50%; left: 50%; transform: translate(-50%, -50%); color: var(--ink-3); font-size: 10px; }
.matrix .opp { position: absolute; transform: translate(-50%, -50%); width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 2px solid var(--surface); box-shadow: var(--shadow); }
.matrix .opp:hover { transform: translate(-50%, -50%) scale(1.15); }
.opp-card { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; background: var(--surface); }
.opp-card .h { display: flex; gap: 8px; align-items: flex-start; }
.opp-card .num { flex: 0 0 auto; width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.opp-card .scores { display: flex; gap: 10px; font-size: 11.5px; color: var(--ink-2); margin: 6px 0; flex-wrap: wrap; }
.opp-card ul { margin: 6px 0 0; padding-left: 18px; font-size: 12.5px; }
.opp-card li.mvp::marker { content: "✓ "; color: var(--positive); }

/* Prüfung */
.oq-at { padding: 0; border: 0; background: none; color: var(--accent); font: inherit; cursor: pointer; text-decoration: underline dotted; text-underline-offset: 2px; }
.flash { outline: 2px solid var(--accent); outline-offset: -2px; }
.finding { display: grid; grid-template-columns: 64px 1fr; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.finding:last-child { border-bottom: 0; }
.finding .lvl { font-size: 10.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 2px 6px; border-radius: 4px; text-align: center; align-self: start; }
.finding .lvl.ERROR { background: var(--breakdown-soft); color: var(--breakdown); } .finding .lvl.WARN { background: var(--friction-soft); color: var(--friction); } .finding .lvl.INFO { background: var(--surface-2); color: var(--ink-2); }
.finding .hint { color: var(--ink-2); font-size: 12.5px; margin-top: 2px; }
.finding .path { font-family: var(--mono); font-size: 11px; color: var(--ink-3); }

/* Übersicht */
.ov-head h2 { font-size: 17px; margin-bottom: 4px; }
.ov-tiles { margin-top: 14px; }
.ov-tiles .tile .sub { font-size: 11.5px; color: var(--ink-3); margin-top: 2px; }
.ov-tiles .tile .evbar { width: 100%; margin-top: 8px; }
.spark { display: flex; gap: 3px; align-items: flex-end; height: 24px; margin-top: 6px; }
.spark i { flex: 1; min-height: 2px; border-radius: 2px 2px 0 0; background: var(--observed); }
.spark i.zero { background: transparent; border-bottom: 2px dotted var(--gap); }
.ov-grid { margin-top: 14px; }
.ov-grid > .panel + .panel { margin-top: 0; }
.bub-wrap { overflow-x: auto; }
.bub th, .bub td { border-bottom: 0; text-align: center; vertical-align: middle; padding: 4px; }
.bub thead th { font-size: 11.5px; font-weight: 600; color: var(--ink); min-width: 64px; }
.bub th.rl { text-align: left; color: var(--ink-2); font-size: 12px; white-space: nowrap; }
.bub .b { position: relative; display: block; width: 50px; height: 50px; margin: 0 auto; padding: 0; border: 0; background: none; cursor: pointer; border-radius: 50%; }
.bub .b:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.bub .b span { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); border-radius: 50%; }
.bub .ring { border: 1.5px solid var(--ink-3); }
.bub .ring.assumed { border: 1.5px dashed var(--assumed); }
.bub .ring.none { border: 2px dotted var(--gap); }
.bub .fill { background: var(--observed); }
.bub .frac { display: block; font-size: 11px; color: var(--ink-2); margin-top: 1px; }
.bub .na { color: var(--ink-3); }
.ov-legend { font-size: 12px; color: var(--ink-2); margin: 8px 0 0; }
.ov-links { margin-top: 8px; }
.ov-link { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 10px 8px 12px; margin-bottom: 8px; cursor: pointer; position: relative; }
.ov-link::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; border-radius: 2px; background: var(--friction); }
.ov-link.breakdown::before { background: var(--breakdown); }
.ov-link:hover, .ov-link:focus-visible { border-color: var(--accent); outline: none; box-shadow: 0 0 0 2px var(--accent-soft); }
.ov-link .where { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 11.5px; color: var(--ink-3); }
.ov-link .stmt { font-size: 13px; font-weight: 600; margin: 4px 0; line-height: 1.35; }
.ov-link .src { position: relative; padding-left: 16px; font-size: 12.5px; color: var(--ink-2); }
.ov-link .src::before { content: "↳"; position: absolute; left: 0; color: var(--ink-3); }
.ov-link .src .q { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; margin-top: 3px; }
.ov-link .src.none { font-style: italic; color: var(--ink-3); }
.ov-link .more { font-size: 11.5px; color: var(--ink-3); margin-top: 3px; padding-left: 16px; }
.ov-keys { font-size: 11.5px; color: var(--ink-3); }

/* Drawer */
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(480px, 100%); background: var(--surface); border-left: 1px solid var(--line); box-shadow: var(--shadow); transform: translateX(105%); transition: transform .22s ease; z-index: 40; display: flex; flex-direction: column; }
.drawer.open { transform: none; }
.drawer .dh { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: flex-start; }
.drawer .dh h2 { font-size: 14px; flex: 1; }
.drawer .db { padding: 14px 16px; overflow: auto; }
.drawer .close { border: 0; background: var(--surface-2); border-radius: 6px; width: 30px; height: 30px; cursor: pointer; }
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.25); z-index: 30; display: none; }
.scrim.open { display: block; }
.claim-txt { font-size: 14px; margin-bottom: 10px; }
.verdict { font-size: 12.5px; padding: 8px 10px; border-radius: 8px; margin-bottom: 12px; }
.verdict.p { background: var(--positive-soft); } .verdict.a { background: var(--assumed-soft); } .verdict.n { background: var(--surface-2); color: var(--ink-2); }

footer { padding: 16px; color: var(--ink-3); font-size: 12px; }
@media print {
  header.top { position: static; } nav.tabs, .controls, .drawer, .scrim, .dl { display: none !important; }
  section.layer { display: block !important; page-break-before: always; } section.layer:first-of-type { page-break-before: auto; }
  .map-wrap { overflow: visible; } body { font-size: 11px; }
}
@media (max-width: 640px) {
  main { padding: 10px; } .title-block h1 { font-size: 17px; } .node-row { grid-template-columns: 1fr; padding-left: 18px; }
  .drawer { width: 100%; }
}
</style>

nten Familien vor der Anmeldung auf einen Blick sehen, was ein Jahr Unterricht kostet – mit Einschreibegebühr, Instrument und möglicher Ermässigung?", "description": "Eine Kostenübersicht pro Instrument auf der Seite «Tarife» statt eines PDF, mit dem Hinweis auf die Ermässigung der Gemeinde und typischen Mietkosten; dieselben Angaben auf dem Flyer und in der Bestätigung.", "linked_pain_points": ["pp-tarif-unverstaendlich", "pp-ermaessigung-unbekannt", "pp-instrumentkosten-ueberraschend", "pp-flyer-ohne-kosten", "pp-bestaetigung-ohne-kosten", "pp-einschreibegebuehr-unerwartet"], "phase_ref": "entdecken", "step_ref": "kosten-klaeren", "user_impact": 4, "public_value": 4, "effort": 2, "owner": "Leitung Sekretariat Musikschule", "status": "open", "stories": [{"text": "Als Elternteil möchte ich vor der Anmeldung sehen, was ein Jahr Unterricht inklusive Instrument kostet, damit ich ohne Überraschung entscheiden kann.", "mvp": true}, {"text": "Als Familie mit kleinem Einkommen möchte ich bei den Tarifen erfahren, dass es eine Ermässigung gibt und wie ich sie beantrage.", "mvp": true}, {"text": "Als Elternteil möchte ich in der Bestätigung der Anmeldung die Kosten noch einmal finden.", "mvp": false}], "evidence_refs": ["bef-01", "bef-02", "bef-03", "web-01"]}, {"id": "opp-warteliste-stand", "hmw": "Wie könnten Familien auf der Warteliste ihren Stand und die übliche Wartezeit für ihr Instrument selbst sehen?", "description": "Stand auf der Liste und Median-Wartezeit je Instrument im Portal; halbjährliche Mitteilung, wie im Prozess vorgesehen. Setzt bei der Ursache der Nachfragen an, nicht beim Telefon.", "linked_pain_points": ["pp-warteliste-ohne-stand", "pp-nachfrage-warteliste-vermeidbar"], "phase_ref": "warten", "step_ref": "warteliste-bescheid", "user_impact": 4, "public_value": 4, "effort": 3, "owner": "Leitung Sekretariat Musikschule", "status": "open", "stories": [{"text": "Als Elternteil möchte ich im Portal sehen, an welcher Stelle mein Kind auf der Warteliste steht egangen.", "locator": "Zeile 14", "signal": "neutral", "phase_hint": "anmelden", "channel_hint": "email", "persona_hint": "eltern-erstanmeldung"}, {"id": "m1-09", "source_ref": "int-m1", "class": "reported", "kind": "quote", "text": "Im Mai kam eine zweite E-Mail: Ihre Tochter ist auf der Warteliste. Kein Wort, wie lange das dauert oder an welcher Stelle wir sind.", "locator": "Zeile 16", "signal": "breakdown", "phase_hint": "warten", "channel_hint": "email", "persona_hint": "eltern-erstanmeldung", "contradicts": ["doc-03"]}, {"id": "m1-10", "source_ref": "int-m1", "class": "reported", "kind": "quote", "text": "Sie war so enttäuscht, und ich wusste nicht, was ich ihr sagen soll.", "locator": "Zeile 17", "signal": "friction", "phase_hint": "warten", "persona_hint": "eltern-erstanmeldung", "emotion_hint": {"valence": -1, "label": "ratlos", "explicit": false}, "tags": ["gefuehl-kind"]}, {"id": "m1-11", "source_ref": "int-m1", "class": "reported", "kind": "quote", "text": "Zweimal angerufen, im September und im Januar.", "locator": "Zeile 19", "signal": "workaround", "phase_hint": "warten", "channel_hint": "phone", "persona_hint": "eltern-erstanmeldung", "tags": ["vermeidbar"]}, {"id": "m1-12", "source_ref": "int-m1", "class": "reported", "kind": "quote", "text": "Ich wollte nicht drängeln, aber man fragt sich ja: Sind wir überhaupt noch auf der Liste?", "locator": "Zeile 19", "signal": "friction", "phase_hint": "warten", "channel_hint": "phone", "persona_hint": "eltern-erstanmeldung", "emotion_hint": {"valence": -1, "label": "wollte nicht drängeln", "explicit": false}, "tags": ["vermeidbar"]}, {"id": "m1-13", "source_ref": "int-m1", "class": "reported", "kind": "quote", "text": "Beim zweiten Mal hat mir die Frau gesagt, wir seien etwa an zwölfter Stelle. Das hat schon geholfen.", "locator": "Zeile 20", "signal": "positive", "phase_hint": "warten", "channel_hint": "phone", "persona_hint": "eltern-erstanmeldung"}, {"id": "m1-14", "source_ref": "int-m1", "class": "reported", "kind": "quote", "text": "Das Platzangebot kam per E-Mail, genau in der ersten Woche der Sportferien.", "locator": "Zeile 22", "signal": "breakdown", "phase_hint": "warten", "channel_hint": "email", "persona_hint": "eltern-erstanmeldung", "tags": ["frist"]}, {"id": "m1-15", "source_ref": "int-m1", "class": "reported", "kind": "quote", "text": "Als wir zurück waren, war die Frist von zehn Tagen abgelaufen und der Platz weg.", "locator": "Zeile 23", "signal": "breakdown", "phase_hint": "warten", "persona_hint": "eltern-erstanmeldung", "tags": ["frist"]}, {"id": "m1-16", "source_ref": "int-m1", "class": "reported", "kind": "quote", "text": "Ich hätte heulen können. Ein Jahr gewartet, und dann verpasst man es wegen einer E-Mail.", "locator": "Zeile 24", "signal": "breakdown", "phase_hint": "warten", "persona_hint": "eltern-erstanmeldung", "emotion_hint": {"valence": -2, "label": "hätte heulen können", "explicit": true}}, {"id": "m1-17", "source_ref": "int-m1", "class": "reported", "kind": "quote", "text": "Ich habe sofort angerufen. Sie haben uns wieder zuoberst auf die Liste gesetzt, und im April kam ein neues Angebot.", "locator": "Zeile 26", "signal": "workaround", "phase_hint": "warten", "channel_hint": "phone", "persona_hint": "eltern-erstanmeldung"}, {"id": "m1-18", "source_ref": "int-m1", "class": "reported", "kind": "quote", "text": "Das war kulant. Aber das wusste ich vorher ja nicht. Ein SMS vor Ablauf der Frist hätte gereicht.", "locator": "Zeile 27", "signal": "need", "phase_hint": "warten", "channel_hint": "sms", "persona_hint": "eltern-erstanmeldung", "tags": ["frist"]}, {"id": "m1-19", "source_ref": "int-m1", "class": "reported", "kind": "quote", "text": "Die Lehrerin hat mir über den Messenger geschrieben und drei Zeiten vorgeschlagen. Das ging ganz unkompliziert.", "locator": "Zeile 29", "signal": "positive", "phase_hint": "start", "channel_hint": "chat", "persona_hint": "eltern-erstanmeldung", "emotion_hint": {"valence": 1, "label": "ganz unkompliziert", "explicit": false}, "tags": ["messenger"], "contradicts": ["doc-06"]}, {"id": "m1-20", "source_ref": "int-m1", "class": "reported", "kind": "quote", "text": "Wir haben ein Digitalpiano gekauft, gebraucht, für 600 Franken.", "locator": "Zeile 31", "value": 600, "unit": "CHF", "signal": "neutral", "phase_hint": "start", "persona_hint": "eltern-erstanmeldung", "tags": ["kosten"]}, {"id": "m1-21", "source_ref": "int-m1", "class": "reported", "kind": "quote", "text": "Dass man ein Instrument zu Hause braucht, war klar, aber nicht, dass es so schnell gehen muss.", "locator": "Zeile 31", "signal": "friction", "phase_hint": "start", "persona_hint": "eltern-erstanmeldung"}, {"id": "m1-22", "source_ref": "int-m1", "class": "reported", "kind": "quote", "text": "Als sie nach der ersten Stunde rauskam, hat sie gestrahlt. Ich war richtig stolz.", "locator": "Zeile 33", "signal": "positive", "phase_hint": "start", "persona_hint": "eltern-erstanmeldung", "emotion_hint": {"valence": 2, "label": "richtig stolz", "explicit": true}, "tags": ["gefuehl-kind"]}, {"id": "m1-23", "source_ref": "int-m1", "class": "reported", "kind": "quote", "text": "Wenn ich auf der Website hätte sehen können, wo wir auf der Liste stehen. Dann hätte ich nicht anrufen müssen.", "locator": "Zeile 35", "signal": "need", "phase_hint": "warten", "channel_hint": "web", "persona_hint": "eltern-erstanmeldung", "tags": ["vermeidbar"]}, {"id": "m2-01", "source_ref": "int-m2", "class": "reported", "kind": "quote", "text": "Er wollte eigentlich Schlagzeug, aber dort war die Warteliste lang, und das Cello hat ihm auch gefallen.", "locator": "Zeile 7", "signal": "workaround", "phase_hint": "entdecken", "persona_hint": "eltern-erstanmeldung", "tags": ["gefuehl-kind"]}, {"id": "m2-02", "source_ref": "int-m2", "class": "reported", "kind": "quote", "text": "820 Franken pro Semester, das ist für uns viel Geld. Ich hätte ihn fast nicht angemeldet.", "locator": "Zeile 9", "value": 820, "unit": "CHF pro Semester", "signal": "friction", "phase_hint": "entdecken", "channel_hint": "web", "persona_hint": "eltern-erstanmeldung", "tags": ["kosten"]}, {"id": "m2-03", "source_ref": "int-m2", "class": "reported", "kind": "quote", "text": "Von der Ermässigung habe ich erst später erfahren. Eine andere Mutter hat es mir beim Fussballtraining gesagt.", "locator": "Zeile 10", "signal": "workaround", "phase_hint": "entdecken", "persona_hint": "eltern-erstanmeldung", "tags": ["kosten"]}, {"id": "m2-04", "source_ref": "int-m2", "class": "reported", "kind": "quote", "text": "Auf der Seite der Musikschule stand nichts davon. Das ist auf der Website der Gemeinde, unter Bildung.", "locator": "Zeile 11", "signal": "friction", "phase_hint": "entdecken", "channel_hint": "web", "persona_hint": "eltern-erstanmeldung"}, {"id": "m2-05", "source_ref": "int-m2", "class": "reported", "kind": "quote", "text": "Online, ohne Probleme. Im Mai kam die Zusage per E-Mail, und ich habe im Portal angenommen.", "locator": "Zeile 13", "signal": "positive", "phase_hint": "warten", "channel_hint": "email", "persona_hint": "eltern-erstanmeldung"}, {"id": "m2-06", "source_ref": "int-m2", "class": "reported", "kind": "quote", "text": "Das Formular musste ich ausdrucken und mit einer Kopie der Steuerveranlagung auf die Gemeinde bringen.", "locator": "Zeile 15", "signal": "friction", "phase_hint": "start", "channel_hint": "paper_form", "persona_hint": "eltern-erstanmeldung"}, {"id": "m2-07", "source_ref": "int-m2", "class": "reported", "kind": "quote", "text": "Muss ich jetzt der Gemeinde meinen Lohn zeigen, damit mein Kind Cello spielen kann? Das war mir unangenehm.", "locator": "Zeile 16", "signal": "friction", "phase_hint": "start", "channel_hint": "paper_form", "persona_hint": "eltern-erstanmeldung", "emotion_hint": {"valence": -1, "label": "unangenehm", "explicit": true}}, {"id": "m2-08", "source_ref": "int-m2", "class": "reported", "kind": "quote", "text": "Im Juli kam die Verfügung: 50 Prozent. Ich habe die Verfügung bekommen und dachte, damit ist es erledigt.", "locator": "Zeile 17", "signal": "neutral", "phase_hint": "start", "channel_hint": "letter", "persona_hint": "eltern-erstanmeldung", "tags": ["kosten"]}, {"id": "m2-09", "source_ref": "int-m2", "class": "reported", "kind": "quote", "text": "Im September kam die Rechnung über 860 Franken, also der volle Betrag und noch die Einschreibegebühr.", "locator": "Zeile 19", "value": 860, "unit": "CHF", "signal": "breakdown", "phase_hint": "bezahlen", "channel_hint": "letter", "persona_hint": "eltern-erstanmeldung", "tags": ["kosten"], "contradicts": ["doc-07"]}, {"id": "m2-10", "source_ref": "int-m2", "class": "reported", "kind": "quote", "text": "Da war ich wirklich sauer. Ich hatte doch alles gemacht.", "locator": "Zeile 20", "signal": "breakdown", "phase_hint": "bezahlen", "persona_hint": "eltern-erstanmeldung", "emotion_hint": {"valence": -2, "label": "wirklich sauer", "explicit": true}}, {"id": "m2-11", "source_ref": "int-m2", "class": "reported", "kind": "quote", "text": "Ich habe bei der Musikschule angerufen. Dort hiess es, die Ermässigung sei Sache der Gemeinde.", "locator": "Zeile 22", "signal": "friction", "phase_hint": "bezahlen", "channel_hint": "phone", "persona_hint": "eltern-erstanmeldung", "tags": ["vermeidbar"]}, {"id": "m2-12", "source_ref": "int-m2", "class": "reported", "kind": "quote", "text": "Die Gemeinde hat gesagt, sie hätten das gemeldet, die Musikschule müsse die Rechnung korrigieren. Ich kam mir hin- und hergeschoben vor.", "locator": "Zeile 23", "signal": "friction", "phase_hint": "bezahlen", "channel_hint": "phone", "persona_hint": "eltern-erstanmeldung", "emotion_hint": {"valence": -1, "label": "hin- und hergeschoben", "explicit": true}, "tags": ["vermeidbar"]}, {"id": "m2-13", "source_ref": "int-m2", "class": "reported", "kind": "quote", "text": "Bezahlt habe ich trotzdem den vollen Betrag, weil ich keine Mahnung wollte.", "locator": "Zeile 24", "signal": "workaround", "phase_hint": "bezahlen", "persona_hint": "eltern-erstanmeldung", "tags": ["kosten"]}, {"id": "m2-14", "source_ref": "int-m2", "class": "reported", "kind": "quote", "text": "Nach fünf Wochen kam eine Gutschrift. Das Geld war also zurück, aber in dem Monat war es knapp.", "locator": "Zeile 25", "value": 5, "unit": "Wochen", "signal": "positive", "phase_hint": "bezahlen", "persona_hint": "eltern-erstanmeldung", "tags": ["kosten"]}, {"id": "m2-15", "source_ref": "int-m2", "class": "reported", "kind": "quote", "text": "Die Musikschule hat eine Liste mit Musikgeschäften geschickt. Wir mieten das Cello für 35 Franken im Monat.", "locator": "Zeile 27", "value": 35, "unit": "CHF pro Monat", "signal": "neutral", "phase_hint": "start", "persona_hint": "eltern-erstanmeldung", "tags": ["kosten"]}, {"id": "m2-16", "source_ref": "int-m2", "class": "reported", "kind": "quote", "text": "Dass noch die Miete fürs Cello dazukommt, hat mir vorher niemand gesagt.", "locator": "Zeile 28", "signal": "friction", "phase_hint": "start", "persona_hint": "eltern-erstanmeldung", "tags": ["kosten"]}, {"id": "m2-17", "source_ref": "int-m2", "class": "reported", "kind": "quote", "text": "Die Lehrerin hat uns über den Messenger geschrieben. Das war gut, sie hat auf das Fussballtraining Rücksicht genommen.", "locator": "Zeile 30", "signal": "positive", "phase_hint": "start", "channel_hint": "chat", "persona_hint": "eltern-erstanmeldung", "tags": ["messenger"], "contradicts": ["doc-06"]}, {"id": "m2-18", "source_ref": "int-m2", "class": "reported", "kind": "quote", "text": "Er geht gern hin. Für uns ist es eine grosse Sache, dass er das machen kann.", "locator": "Zeile 32", "signal": "positive", "phase_hint": "weiterfuehren", "persona_hint": "eltern-erstanmeldung", "tags": ["gefuehl-kind"]}, {"id": "m2-19", "source_ref": "int-m2", "class": "reported", "kind": "quote", "text": "Wenn man die Ermässigung gleich bei der Anmeldung angeben könnte. Und wenn sie dann einfach auf der Rechnung steht.", "locator": "Zeile 34", "signal": "need", "phase_hint": "start", "persona_hint": "eltern-erstanmeldung", "tags": ["kosten"]}, {"id": "m3-01", "source_ref": "int-m3", "class": "reported", "kind": "quote", "text": "Am Anfang super. Die Lehrerin ist toll, und er hat zu Hause von sich aus geübt.", "locator": "Zeile 7", "signal": "positive", "phase_hint": "weiterfuehren", "persona_hint": "eltern-erstanmeldung", "tags": ["gefuehl-kind"]}, {"id": "m3-02", "source_ref": "int-m3", "class": "reported", "kind": "quote", "text": "Nach den Weihnachtsferien wurde es zäh. Jeden Abend Streit ums Üben.", "locator": "Zeile 8", "signal": "friction", "phase_hint": "weiterfuehren", "persona_hint": "eltern-erstanmeldung", "tags": ["gefuehl-kind"]}, {"id": "m3-03", "source_ref": "int-m3", "class": "reported", "kind": "quote", "text": "Er mag nicht mehr üben. Sollen wir aufhören, oder ist das nur eine Phase?", "locator": "Zeile 9", "signal": "need", "phase_hint": "weiterfuehren", "persona_hint": "eltern-erstanmeldung"}, {"id": "m3-04", "source_ref": "int-m3", "class": "reported", "kind": "quote", "text": "Ich war hin- und hergerissen. Man will ja nicht, dass das Kind beim ersten Widerstand aufgibt.", "locator": "Zeile 10", "signal": "neutral", "phase_hint": "weiterfuehren", "persona_hint": "eltern-erstanmeldung", "emotion_hint": {"valence": -1, "label": "hin- und hergerissen", "explicit": true}}, {"id": "m3-05", "source_ref": "int-m3", "class": "reported", "kind": "quote", "text": "Im Mai haben wir gesagt: Nach den Sommerferien hört er auf.", "locator": "Zeile 12", "signal": "neutral", "phase_hint": "weiterfuehren", "persona_hint": "eltern-erstanmeldung"}, {"id": "m3-06", "source_ref": "int-m3", "class": "reported", "kind": "quote", "text": "Ich habe es der Lehrerin über den Messenger geschrieben, wie alles andere auch. Sie hat geantwortet: Schade, danke für die Info.", "locator": "Zeile 13", "signal": "breakdown", "phase_hint": "weiterfuehren", "channel_hint": "chat", "persona_hint": "eltern-erstanmeldung", "tags": ["messenger", "frist"], "contradicts": ["doc-09"]}, {"id": "m3-07", "source_ref": "int-m3", "class": "reported", "kind": "quote", "text": "Für mich war die Sache damit erledigt.", "locator": "Zeile 14", "signal": "neutral", "phase_hint": "weiterfuehren", "persona_hint": "eltern-erstanmeldung"}, {"id": "m3-08", "source_ref": "int-m3", "class": "reported", "kind": "quote", "text": "Im September kam die Rechnung fürs Herbstsemester, 820 Franken.", "locator": "Zeile 16", "value": 820, "unit": "CHF", "signal": "breakdown", "phase_hint": "weiterfuehren", "channel_hint": "letter", "persona_hint": "eltern-erstanmeldung", "tags": ["kosten"]}, {"id": "m3-09", "source_ref": "int-m3", "class": "reported", "kind": "quote", "text": "Die Abmeldung müsse schriftlich ans Sekretariat gehen, bis Ende Mai. Eine Nachricht an die Lehrerin gelte nicht.", "locator": "Zeile 17", "signal": "breakdown", "phase_hint": "weiterfuehren", "channel_hint": "phone", "persona_hint": "eltern-erstanmeldung", "tags": ["frist", "messenger"]}, {"id": "m3-10", "source_ref": "int-m3", "class": "reported", "kind": "quote", "text": "Das stand wohl irgendwo im Kleingedruckten. Aber wir haben ein ganzes Jahr nur mit der Lehrerin kommuniziert.", "locator": "Zeile 18", "signal": "friction", "phase_hint": "weiterfuehren", "persona_hint": "eltern-erstanmeldung", "tags": ["frist", "messenger"], "contradicts": ["ws-05"]}, {"id": "m3-11", "source_ref": "int-m3", "class": "reported", "kind": "quote", "text": "Ich habe ein Gesuch um Erlass geschrieben. Abgelehnt.", "locator": "Zeile 19", "signal": "workaround", "phase_hint": "weiterfuehren", "channel_hint": "letter", "persona_hint": "eltern-erstanmeldung"}, {"id": "m3-12", "source_ref": "int-m3", "class": "reported", "kind": "quote", "text": "820 Franken für etwas, das wir abgemeldet hatten. Das hat richtig wehgetan.", "locator": "Zeile 20", "value": 820, "unit": "CHF", "signal": "breakdown", "phase_hint": "weiterfuehren", "persona_hint": "eltern-erstanmeldung", "emotion_hint": {"valence": -2, "label": "hat richtig wehgetan", "explicit": true}, "tags": ["kosten"]}, {"id": "m3-13", "source_ref": "int-m3", "class": "reported", "kind": "quote", "text": "Wenn wir schon zahlen, dann soll er wenigstens hingehen. Er ist noch ein Semester gegangen, ziemlich lustlos.", "locator": "Zeile 22", "signal": "workaround", "phase_hint": "weiterfuehren", "persona_hint": "eltern-erstanmeldung", "tags": ["gefuehl-kind"]}, {"id": "m3-14", "source_ref": "int-m3", "class": "reported", "kind": "quote", "text": "Ja, im August hat die Schule den Stundenplan geändert, und die Gitarrenstunde lag plötzlich auf dem Turnen.", "locator": "Zeile 24", "signal": "friction", "phase_hint": "start", "persona_hint": "eltern-erstanmeldung"}, {"id": "m3-15", "source_ref": "int-m3", "class": "reported", "kind": "quote", "text": "Die Lehrerin hat in der Messenger-Gruppe neue Zeiten herumgeschickt. Bis alles wieder gepasst hat, waren es drei Wochen ohne Unterricht.", "locator": "Zeile 25", "value": 3, "unit": "Wochen", "signal": "friction", "phase_hint": "start", "channel_hint": "chat", "persona_hint": "eltern-erstanmeldung", "tags": ["messenger"]}, {"id": "m3-16", "source_ref": "int-m3", "class": "reported", "kind": "quote", "text": "Diesmal mit einem Brief ans Sekretariat, Ende November, für Ende Januar. Da habe ich sogar eine Bestätigung bekommen.", "locator": "Zeile 27", "signal": "positive", "phase_hint": "weiterfuehren", "channel_hint": "letter", "persona_hint": "eltern-erstanmeldung"}, {"id": "m3-17", "source_ref": "int-m3", "class": "reported", "kind": "quote", "text": "Alles Wichtige schriftlich ans Sekretariat. Die Lehrerin ist nett, aber sie ist nicht die Verwaltung.", "locator": "Zeile 29", "signal": "need", "phase_hint": "weiterfuehren", "persona_hint": "eltern-erstanmeldung", "tags": ["messenger"]}, {"id": "m3-18", "source_ref": "int-m3", "class": "reported", "kind": "quote", "text": "Wenn die Lehrerin weiss, dass er aufhört, könnte sie das doch weitergeben. Oder man schrei aessigung-musikschule): 610 Aufrufe, Ausstiegsrate 48 %, durchschnittlich 72 Sekunden.", "locator": "Zeile 5", "value": 610, "unit": "Aufrufe", "signal": "friction", "phase_hint": "entdecken", "channel_hint": "web", "persona_hint": "eltern-erstanmeldung", "tags": ["kosten"]}, {"id": "web-03", "source_ref": "analytics", "class": "observed", "kind": "metric", "text": "Seite «Anmeldung» (/musikschule/anmeldung): 2940 Aufrufe, Ausstiegsrate 22 %, durchschnittlich 380 Sekunden.", "locator": "Zeile 4", "value": 22, "unit": "% Ausstiegsrate", "signal": "positive", "phase_hint": "anmelden", "channel_hint": "web", "persona_hint": "eltern-erstanmeldung"}, {"id": "web-04", "source_ref": "analytics", "class": "observed", "kind": "metric", "text": "Seite «Warteliste» (/musikschule/warteliste): 2150 Aufrufe, Ausstiegsrate 73 %, durchschnittlich 28 Sekunden.", "locator": "Zeile 6", "value": 73, "unit": "% Ausstiegsrate", "signal": "friction", "phase_hint": "warten", "channel_hint": "web", "persona_hint": "eltern-erstanmeldung"}, {"id": "web-05", "source_ref": "analytics", "class": "observed", "kind": "metric", "text": "Seite «Abmeldung» (/musikschule/abmeldung): 940 Aufrufe, Ausstiegsrate 41 %, durchschnittlich 55 Sekunden.", "locator": "Zeile 7", "value": 940, "unit": "Aufrufe", "signal": "neutral", "phase_hint": "weiterfuehren", "channel_hint": "web", "persona_hint": "eltern-erstanmeldung"}, {"id": "tar-01", "source_ref": "tarife", "class": "assumed", "kind": "document_excerpt", "text": "Das Schulgeld für Einzelunterricht von 30 Minuten pro Woche beträgt für Kinder und Jugendliche mit Wohnsitz in der Gemeinde 820 Franken pro Semester.", "locator": "Zeile 7", "value": 820, "unit": "CHF pro Semester", "signal": "neutral", "phase_hint": "bezahlen", "tags": ["kosten"]}, {"id": "tar-02", "source_ref": "tarife", "class": "assumed", "kind": "document_excerpt", "text": "Bei Eintritt wird eine einmalige Einschreibegebühr von 40 Franken erhoben.", "locator": "Zeile 9", "value": 40, "unit": "CHF", "signal": "neutral", "phase_hint": "bezahlen", "tags": ["kosten"]}, {"id": "tar-03", "source_ref": "tarife", "class": "assumed", "kind": "document_excerpt", "text": "Die Gemeinde gewährt auf Antrag eine Ermässigung von 25 oder 50 Prozent, abgestuft nach dem steuerbaren Einkommen gemäss letzter Steuerveranlagung.", "locator": "Zeile 13", "signal": "neutral", "phase_hint": "start", "tags": ["kosten"]}, {"id": "tar-04", "source_ref": "tarife", "class": "assumed", "kind": "document_excerpt", "text": "Der Antrag ist bei der Gemeindeverwaltung, Abteilung Bildung, bis 30. Juni für das folgende Schuljahr einzureichen.", "locator": "Zeile 14", "signal": "neutral", "phase_hint": "start", "tags": ["frist"]}, {"id": "tar-05", "source_ref": "tarife", "class": "assumed", "kind": "document_excerpt", "text": "Die Instrumente werden von den Eltern beschafft. Die Musikschule vermittelt Adressen von Musikgeschäften.", "locator": "Zeile 18", "signal": "neutral", "phase_hint": "start", "tags": ["kosten"]}, {"id": "tar-06", "source_ref": "tarife", "class": "assumed", "kind": "document_excerpt", "text": "Die Abmeldung erfolgt schriftlich an das Sekretariat der Musikschule bis 31. Mai auf Ende des Schuljahres oder bis 30. November auf Ende des Herbstsemesters.", "locator": "Zeile 22", "signal": "neutral", "phase_hint": "weiterfuehren", "channel_hint": "letter", "tags": ["frist"]}, {"id": "tar-07", "source_ref": "tarife", "class": "assumed", "kind": "document_excerpt", "text": "Bei verspäteter Abmeldung ist das Schulgeld für das folgende Semester geschuldet.", "locator": "Zeile 23", "signal": "neutral", "phase_hint": "weiterfuehren", "tags": ["frist", "kosten"]}, {"id": "tar-08", "source_ref": "tarife", "class": "assumed", "kind": "document_excerpt", "text": "Über einen Erlass entscheidet die Schulleitung; Gründe sind insbesondere Umzug oder Krankheit.", "locator": "Zeile 24", "signal": "neutral", "phase_hint": "weiterfuehren"}, {"id": "doc-01", "source_ref": "prozessdok", "class": "assumed", "kind": "document_excerpt", "text": "Anmeldungen gehen bis 31. März über das Online-Portal ein.", "locator": "Zeile 22", "signal": "neutral", "phase_hint": "anmelden", "channel_hint": "web", "tags": ["frist"]}, {"id": "doc-02", "source_ref": "prozessdok", "class": "assumed", "kind": "document_excerpt", "text": "Die automatische Bestätigung informiert über Tarife und Ermässigung.", "locator": "Zeile 23", "signal": "neutral", "phase_hint": "anmelden", "channel_hint": "email"}, {"id": "doc-03", "source_ref": "prozessdok", "class": "assumed", "kind": "document_excerpt", "text": "Familien auf der Warteliste werden halbjährlich über ihren Stand informiert.", "locator": "Zeile 28", "signal": "neutral", "phase_hint": "warten"}, {"id": "doc-04", "source_ref": "prozessdok", "class": "assumed", "kind": "document_excerpt", "text": "Platzangebote werden per E-Mail versandt. Die Annahme erfolgt innert zehn Tagen im Portal; ohne Annahme geht der Platz an die nächste Person auf der Warteliste.", "locator": "Zeile 29", "signal": "neutral", "phase_hint": "warten", "channel_hint": "email", "tags": ["frist"]}, {"id": "doc-05", "source_ref": "prozessdok", "class": "assumed", "kind": "document_excerpt", "text": "Die Lehrperson vereinbart die Unterrichtszeit direkt mit der Familie.", "locator": "Zeile 33", "signal": "neutral", "phase_hint": "start"}, {"id": "doc-06", "source_ref": "prozessdok", "class": "assumed", "kind": "document_excerpt", "text": "Für die Kommunikation mit den Familien ist die Schul-App der Musikschule zu verwenden.", "locator": "Zeile 34", "signal": "neutral", "phase_hint": "start", "tags": ["messenger"]}, {"id": "doc-07", "source_ref": "prozessdok", "class": "assumed", "kind": "document_excerpt", "text": "Bewilligte Ermässigungen meldet die Gemeinde der Musikschule bis 15. August.", "locator": "Zeile 38", "signal": "neutral", "phase_hint": "start", "tags": ["kosten"]}, {"id": "doc-08", "source_ref": "prozessdok", "class": "assumed", "kind": "document_excerpt", "text": "Die Rechnungen für das Herbstsemester werden Anfang September versandt.", "locator": "Zeile 39", "signal": "neutral", "phase_hint": "bezahlen", "channel_hint": "letter"}, {"id": "doc-09", "source_ref": "prozessdok", "class": "assumed", "kind": "document_excerpt", "text": "Abmeldungen nimmt ausschliesslich das Sekretariat entgegen. Die Lehrpersonen weisen die Familien darauf hin.", "locator": "Zeile 43", "signal": "neutral", "phase_hint": "weiterfuehren", "tags": ["messenger"]}, {"id": "ws-01", "source_ref": "workshop", "class": "assumed", "kind": "workshop_statement", "text": "Annahme: Eltern informieren sich vor der Anmeldung über die Tarife; die Kosten sind bekannt.", "locator": "Zeile 11", "signal": "neutral", "phase_hint": "entdecken", "tags": ["kosten"]}, {"id": "ws-02", "source_ref": "workshop", "class": "assumed", "kind": "workshop_statement", "text": "Annahme: Die Warteliste ist bekannt und akzeptiert; Nachfragen sind die Ausnahme.", "locator": "Zeile 12", "signal": "neutral", "phase_hint": "warten"}, {"id": "ws-03", "source_ref": "workshop", "class": "assumed", "kind": "workshop_statement", "text": "Annahme: Die Lehrpersonen klären die Unterrichtszeit selbstständig mit den Familien, und das funktioniert gut.", "locator": "Zeile 13", "signal": "neutral", "phase_hint": "start"}, {"id": "ws-04", "source_ref": "workshop", "class": "assumed", "kind": "workshop_statement", "text": "Annahme: Die Ermässigungen kommen rechtzeitig von der Gemeinde; Fehler auf der Rechnung sind Einzelfälle.", "locator": "Zeile 14", "signal": "neutral", "phase_hint": "bezahlen", "tags": ["kosten"]}, {"id": "ws-05", "source_ref": "workshop", "class": "assumed", "kind": "workshop_statement", "text": "Annahme: Die Abmeldefrist ist bekannt, weil sie auf jeder Rechnung steht.", "locator": "Zeile 15", "signal": "neutral", "phase_hint": "weiterfuehren", "tags": ["frist"]}], "open_questions": [{"text": "Wie viele Familien verzichten wegen der Kosten auf eine Anmeldung – und wie viele, weil sie die Ermässigung nicht kennen? Befragung und Statistik erreichen nur angemeldete Familien.", "step_ref": "kosten-klaeren", "proposed_method": "interview"}, {"text": "Wann und auf welchem Weg meldet die Gemeinde bewilligte Ermässigungen der Musikschule, und warum kommen 38 % erst nach der Rechnung an? Gehört in den Service Blueprint.", "step_ref": "ermaessigung-beantragen", "proposed_method": "source_request"}, {"text": "Wohin gehen die 18 % der Familien, die während der Wartezeit abmelden – privater Unterricht, anderes Instrument, gar nichts?", "step_ref": "warteliste-bescheid", "proposed_method": "survey"}, {"text": "Wie erlebt das Kind die Warteliste, den ersten Unterricht und das Aufhören? Die Journey kennt seine Gefühle nur aus dem Mund der Eltern; ein kindgerechtes Gespräch würde zeigen, ob die Kurve der Eltern auch seine ist.", "phase_ref": "weiterfuehren", "proposed_method": "interview"}], "changelog": [{"version": "0.1", "date": "2026-04-22", "summary": "Hypothesen-Workshop ohne Eltern: Phasen nach dem Ablauf der Musikschule (Anmeldung, Einteilung, Unterrichtsbeginn, Rechnung, Abmeldung), keine Nutzerevidenz.", "author": "Schulleitung Musikschule"}, {"version": "1.0", "date": "2026-10-13", "summary": "Drei Interviews, Anfragen-Export, Kennzahlen der Musikschulverwaltung, Elternbefragung und Webanalytics eingearbeitet; Phasen aus Elternsicht neu geschnitten (Warteliste sowie Weitermachen oder aufhören als eigene Phasen); Kosten und vermeidbare Kontakte nach den Mustern des Skills erfasst; Chancen priorisiert.", "author": "Schulleitung Musikschule"}]}], "findings": [[{"code": "L043", "level": "INFO", "antipattern": "evidence", "message": "4 Emotionspunkt(e) sind aus Evidenz abgeleitet, nicht ausdrücklich geäussert (emotion_hint.explicit fehlt).", "path": "", "hint": ""}, {"code": "L100", "level": "INFO", "antipattern": "evidence", "message": "5 Evidenz-Atom(e) werden nirgends referenziert: bef-09, ws-01, ws-02, ws-04, ws-05.", "path": "evidence" class Idx {

    j.phases.forEach((p, pi) => p.steps.forEach((s, si) => {
      this.steps.push({ step: s, phase: p, pi, si, gi: this.steps.length });
      (s.pain_points || []).forEach(pp => { this.pp.set(pp.id, pp); this.ppStep.set(pp.id, s.id); });
    }));

    this.cons = new Map(); this.pp.forEach((pp, id) => (pp.caused_by || []).forEach(c => { if (c !== id && this.pp.has(c)) this.cons.set(c, (this.cons.get(c) || []).concat(id)); }));
  }
  classes(refs) { const out = { observed: 0, reported: 0, assumed: 0, missing: 0 }; (refs || []).forEach(r => { const a = this.ev.get(r); if (a) out[a.class]++; else out.missing++; }); return out; }
  hasPrimary(refs) { return (refs || []).some(r => PRIMARY.has(this.ev.get(r)?.class)); }
  evState(refs) { if (!refs || !refs.length) return "none"; return this.hasPrimary(refs) ? "primary" : "assumed"; }
  summary() { const s = { observed: 0, reported: 0, assumed: 0, total: 0 }; this.ev.forEach(a => { s[a.class]++; s.total++; }); return s; }
  oppsFor(ppId) { return this.opps.filter(o => (o.linked_pain_points || []).includes(ppId)); }
  // Phase einer Chance: die ihres Schritts (step_ref), sonst phase_ref, sonst die des ersten Pain Points – wie model.opportunity_anchor
  oppPhase(o) { const s = this.steps.find(x => x.step.id === o.step_ref); if (s) return s.phase.id; if (o.phase_ref) return o.phase_ref; const st = this.ppStep.get((o.linked_pain_points || [])[0]); const e = this.steps.find(x => x.step.id === st); return e ? e.phase.id : null; }

  claims() { // für Heatmap und Quoten
    const out = [];
    this.steps.forEach(e => { const s = e.step; out.push({ kind: "step", refs: s.evidence_refs || [], e });

      (s.edge_cases || []).forEach(p => out.push({ kind: "edge_case", refs: p.evidence_refs || [], e }));

  const bars = j.phases.map(p => { const pe = exp.filter(c => c.e.phase === p), pb = pe.filter(c => idx.hasPrimary(c.refs)).length; return pe.length ? { h: Math.round(pb / pe.length * 100), title: t("ovPhaseShare", { p: p.name, b: pb, n: pe.length }) } : { title: t("ovPhaseNone", { p: p.name }) }; });

  const pct = s.total ? [s.observed, s.reported, s.assumed].map(v => Math.round(v / s.total * 100)) : [0, 0, 0];

  let h = '<div class="panel ov-head"><h2>' + t("ovTitle") + '</h2><p class="muted" style="margin:0">' + t("ovIntro") + '</p></div><div class="tiles ov-tiles">'

    h += '</tr>'; });

  // Pain Point ↳ stärkster Beleg; der Filter «Nur Primärevidenz» blendet wie in der Journey aus
  const shown = pps.filter(x => visible(idx, x.pp.evidence_refs)), hidden = pps.length - shown.length;
  shown.sort((a, b) => (a.pp.type === "breakdown" ? 0 : 1) - (b.pp.type === "breakdown" ? 0 : 1) || (b.pp.severity || 0) - (a.pp.severity || 0) || a.e.gi - b.e.gi);
  const best = refs => refs.map(r => idx.ev.get(r)).filter(Boolean).sort((a, b) => CLASS_RANK[a.class] - CLASS_RANK[b.class] || (a.kind === "quote" ? 0 : 1) - (b.kind === "quote" ? 0 : 1))[0];

  shown.forEach(({ pp, e }) => { const refs = pp.evidence_refs || [], a = best(refs), src = a && idx.src.get(a.source_ref), more = refs.length - (a ? 1 : 0);
    h += '<button class="ov-link ' + pp.type + '" data-refs="' + esc(refs.join(",")) + '" data-title="' + esc(pp.id) + '" data-text="' + esc(pp.text) + '"><div class="where"><span class="tag ' + pp.type + '">' + (pp.type === "breakdown" ? t("breakdown") : t("friction")) + '</span>' + sevMarks(pp) + '<span>' + esc(e.phase.name) + ' · ' + esc(e.step.name) + '</span></div><div class="stmt">' + esc(pp.text) + '</div>'
      + (a ? '<div class="src"><span class="cls ' + a.class + '">' + L.classes[a.class] + '</span> ' + esc(src ? src.title : a.source_ref) + '<div class="q">' + (a.kind === "quote" ? t("quoted", { t: esc(a.text) }) : esc(a.text)) + '</div></div>' + (more > 0 ? '<div class="more">' + tn("ovMore", more) + '</div>' : '') : '<div class="src none">' + t("noEvidence") + '</div>') + '</button>'; });
  if (!pps.length) h += '<p class="muted">' + t("ovNoLinks") + '</p>';

function drawCurve(idx) {
  const el = $("#curve"); if (!el) return;
  const n = idx.steps.length, W = el.clientWidth || n * 230, H = el.clientHeight || 150;
  const x = i => (i + 0.5) / n * W, y = v => H * (0.5 - v * 0.19);
  let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">';
  let html = '<div class="zero"></div><span class="scale" style="top:' + (y(2) - 6) + 'px">++</span><span class="scale" style="top:' + (y(-2) - 6) + 'px">−−</span>';
  // andere Personas: Punkte je Phase gleichmässig verteilt (Position, nicht Zeit).
  // Zuordnung nur über gleiche Phasen-IDs; was dabei wegfällt, wird gekennzeichnet statt verschwiegen.
  const gaps = new Map(), dropped = [];
  journeys.forEach((other, oi) => { if (oi === state.j) return; const col = ["var(--observed)", "var(--reported)", "var(--friction)", "var(--positive)"][oi % 4]; const pts = [];
    idx.j.phases.forEach(p => { const op = other.phases.find(q => q.id === p.id);
      const why = !op ? t("noDataPhase") : op.steps.some(s => s.feeling) ? "" : t("noFeelingPhase");
      if (why) { if (!gaps.has(p.id)) gaps.set(p.id, []); gaps.get(p.id).push(jLabel(other) + t("colon") + why); } });
    const lost = other.phases.filter(op => !idx.j.phases.some(p => p.id === op.id)).map(op => t("quoted", { t: op.name }));
    if (lost.length) dropped.push(jLabel(other) + t("colon") + lost.join(", "));
    other.phases.forEach(op => { const mine = idx.j.phases.find(p => p.id === op.id); if (!mine) return; const start = idx.steps.find(e => e.phase.id === mine.id).gi, span = mine.steps.length; op.steps.forEach((s, k) => { const gx = start + (k + 0.5) / op.steps.length * span - 0.5; pts.push({ gx, v: s.feeling ? s.feeling.valence : null, label: s.name, name: jLabel(other) }); }); });
    let d = "", pen = false; pts.forEach(p => { if (p.v == null) { pen = false; return; } d += (pen ? " L" : " M") + x(p.gx) + " " + y(p.v); pen = true; });
    svg += '<path d="' + d + '" fill="none" stroke="' + col + '" stroke-width="1.5" stroke-dasharray="4 3" vector-effect="non-scaling-stroke" opacity=".8"/>';
    pts.forEach(p => { if (p.v == null) return; html += '<span class="pt other" style="left:' + x(p.gx) + 'px;top:' + y(p.v) + 'px;border-color:' + col + ';background:' + col + '" title="' + esc(p.name + t("colon") + p.label) + '"></span>'; }); });
  // diese Persona
  let d = "", pen = false, lastPt = null;
  idx.steps.forEach(e => { const f = e.step.feeling; const px = x(e.gi); if (!f) { pen = false; return; }
    if (pen) d += " L" + px + " " + y(f.valence);
    else { if (lastPt) svg += '<path d="M' + lastPt.x + ' ' + lastPt.y + ' L' + px + ' ' + y(f.valence) + '" fill="none" stroke="var(--gap)" stroke-width="1.5" stroke-dasharray="3 4" vector-effect="non-scaling-stroke"/>'; d += " M" + px + " " + y(f.valence); }
    pen = true; lastPt = { x: px, y: y(f.valence) }; });
  svg += '<path d="' + d + '" fill="none" stroke="var(--ink)" stroke-width="2.5" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>';
  idx.steps.forEach(e => { const f = e.step.feeling, px = x(e.gi);
    if (!f) { html += '<span class="pt gap" style="left:' + px + 'px;top:' + (H / 2) + 'px" title="' + t("noFeelingTitle") + '">?</span><span class="lbl" style="left:' + px + 'px;top:' + (H / 2 + 14) + 'px">' + t("noEvidence") + '</span>'; return; }
    const st = idx.evState(f.evidence_refs), cls = st === "primary" ? "" : st === "assumed" ? " assumed" : " hollow";
    html += '<span class="pt' + cls + '" style="left:' + px + 'px;top:' + y(f.valence) + 'px" data-refs="' + esc((f.evidence_refs || []).join(",")) + '" data-title="' + esc(t("feelingTitle", { s: e.step.name })) + '" data-text="' + esc(f.label || "") + ' (' + (f.valence > 0 ? "+" : "") + f.valence + ')" title="' + esc(f.label || "") + '"></span>';
    if (f.label) html += '<span class="lbl" style="left:' + px + 'px;top:' + (f.valence >= 0 ? y(f.valence) + 12 : y(f.valence) - 34) + 'px">' + esc(f.label.length > 44 ? f.label.slice(0, 42) + "…" : f.label) + '</span>'; });
  gaps.forEach((notes, pid) => { const first = idx.steps.find(e => e.phase.id === pid); if (!first) return; const span = first.phase.steps.length;

// ---------------------------------------------------------------- Layer 3: Evidenz
function renderEvidence(idx) {

  // Widersprüche & unbenutzt

// ---------------------------------------------------------------- Drawer

  const c = idx.classes(atoms.filter(a => !a.missing).map(a => a.id));
  let v;
  if (!atoms.length) v = '<div class="verdict n">' + t("verdictNone") + '</div>';
  else if (c.observed + c.reported > 0) v = '<div class="verdict p">' + t("verdictPrimary", { list: [c.observed ? t("verdictObs", { n: c.observed }) : "", c.reported ? t("verdictRep", { n: c.reported }) : ""].filter(Boolean).join(t("and")), extra: c.assumed ? t("verdictExtra", { n: c.assumed }) : "" }) + '</div>';
  else v = '<div class="verdict a">' + t("verdictAssumed", { n: c.assumed }) + '</div>';
  $("#dBody").innerHTML = '<div class="claim-txt">' + esc(text) + '</div>' + v + atoms.map(a => a.missing ? '<div class="atom c-breakdown">' + esc(t("unknownRef", { id: a.id })) + '</div>' : atomHtml(idx, a)).join("");
  $("#drawer").classList.add("open"); $("#scrim").classList.add("open");

function showTab(t) { state.tab = t; document.querySelectorAll("section.layer").forEach(s => s.classList.toggle("active", s.dataset.l === t)); document.querySelectorAll("nav.tabs button").forEach(b => b.classList.toggle("active", b.dataset.tab === t)); if (t === "journey") requestAnimationFrame(() => drawCurve(IDX)); }

$("#primOnly").addEventListener("change", ev => { state.primOnly = ev.target.checked; render(); });
$("#personaSel").addEventListener("change", ev => { state.j = +ev.target.value; render(); });
$("#themeBtn").addEventListener("click", () => { const r = document.documentElement, cur = r.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); r.dataset.theme = cur === "dark" ? "light" : "dark"; });
window.addEventListener("resize", () => drawCurve(IDX));
document.documentElement.lang = LANG;
document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
document.querySelectorAll("[data-i18n-title]").forEach(el => { el.title = t(el.dataset.i18nTitle); });
document.querySelectorAll("[data-i18n-aria]").forEach(el => { el.setAttribute("aria-label", t(el.dataset.i18nAria)); });

if (!DATA || !DATA.journeys?.length) { $("#main").innerHTML = '<div class="panel"><h2>' + t("noData") + '</h2><p>' + t("noDataText", { cmd: "<code>journeykit render journey.json</code>" }) + '</p></div>'; }
else render();
</script>
</body>
</html>
