[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "journeykit"
version = "0.1.0"
description = "Evidence-based User Journeys for public administration: schema, lints, renderer, skill"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Hayal Özkan" }]
keywords = ["user-journey", "service-design", "public-administration", "claude", "skill"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Other Audience",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business",
]
dependencies = ["jsonschema>=4.18"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
journeykit = "journeykit.cli:main"

[project.urls]
Homepage = "https://github.com/malkreide/journeykit"
Issues = "https://github.com/malkreide/journeykit/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
journeykit = ["viewer/*.html", "schema/*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
